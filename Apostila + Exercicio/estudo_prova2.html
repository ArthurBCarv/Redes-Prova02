<html lang="pt-BR">

<meta name="color-scheme" content="light dark">
<meta name="description" content="Plataforma interativa e offline de estudo para a Prova 2 de Redes de Computadores">
<title>Redes Prova 2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23C2562F'/%3E%3Cpath d='M12 6v5M7 16v-2h10v2' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   Design system — paleta quente, tokens semânticos, claro/escuro
   ===================================================================== */
:root {
  --bg: #FBF6EE; --surface: #FFFCF8; --surface-2: #F5ECE0; --surface-3: #EFE3D3;
  --text: #2E2118; --text-2: #5E4A3B; --text-3: #7A6352;
  --primary: #C2562F; --primary-strong: #A4441F; --primary-soft: #F7E1D6; --on-primary: #FFFFFF;
  --accent: #E39B2D; --accent-soft: #FBEBCC; --accent-text: #8A5A0E;
  --success: #5E7A2E; --success-soft: #E8EFD8; --error: #A63A28; --error-soft: #F6DDD7;
  --info: #3F6A8A; --info-soft: #E1ECF2;
  --border: #E4D6C5; --border-strong: #CDB9A3; --focus: #C2562F;
  --shadow-1: 0 1px 2px rgba(60, 35, 15, .06), 0 1px 1px rgba(60, 35, 15, .04);
  --shadow-2: 0 6px 18px rgba(60, 35, 15, .08), 0 2px 4px rgba(60, 35, 15, .05);
  --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 32px; --s6: 48px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --measure: 76ch; --sidebar: 264px;
  --term-bg: #241A14; --term-text: #F3E6D6; --term-dim: #BFA58C; --term-ok: #C6D98F; --term-err: #F2A08C;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1712; --surface: #271E18; --surface-2: #30251D; --surface-3: #3A2D24;
    --text: #F4E9DD; --text-2: #D6C4B2; --text-3: #B59F8A;
    --primary: #E5774E; --primary-strong: #F08D66; --primary-soft: #46281C; --on-primary: #1E1712;
    --accent: #F0B455; --accent-soft: #45341A; --accent-text: #F4C77C;
    --success: #A7C46A; --success-soft: #2D3520; --error: #F08A75; --error-soft: #47231C;
    --info: #8CB8D6; --info-soft: #1F2E38;
    --border: #44352A; --border-strong: #5C4838; --focus: #F0B455;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 8px 22px rgba(0, 0, 0, .45);
    --term-bg: #140F0B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1712; --surface: #271E18; --surface-2: #30251D; --surface-3: #3A2D24;
  --text: #F4E9DD; --text-2: #D6C4B2; --text-3: #B59F8A;
  --primary: #E5774E; --primary-strong: #F08D66; --primary-soft: #46281C; --on-primary: #1E1712;
  --accent: #F0B455; --accent-soft: #45341A; --accent-text: #F4C77C;
  --success: #A7C46A; --success-soft: #2D3520; --error: #F08A75; --error-soft: #47231C;
  --info: #8CB8D6; --info-soft: #1F2E38;
  --border: #44352A; --border-strong: #5C4838; --focus: #F0B455;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 8px 22px rgba(0, 0, 0, .45);
  --term-bg: #140F0B;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 var(--s2); letter-spacing: -.01em; }
h1 { font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); }
h2 { font-size: 1.35rem; } h3 { font-size: 1.12rem; } h4 { font-size: 1rem; margin-top: var(--s4); }
p { margin: 0 0 var(--s3); }
a { color: var(--primary-strong); }
code, pre, kbd { font-family: var(--mono); font-size: .9em; }
code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 0 .3em; white-space: nowrap; }
pre { margin: 0 0 var(--s3); }
ul, ol { padding-left: 1.3em; margin: 0 0 var(--s3); }
li { margin: .2em 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--text-3); } .small { font-size: .875rem; } .tiny { font-size: .78rem; }
.mono { font-family: var(--mono); }
.row { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: var(--s3); }
.grid { display: grid; gap: var(--s3); }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); }
.spacer { flex: 1; }
hr { border: 0; border-top: 1px solid var(--border); margin: var(--s4) 0; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.brand { display: flex; gap: var(--s2); align-items: center; padding: var(--s2) var(--s2) var(--s3); }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; }
.brand-title { font-weight: 700; line-height: 1.2; }
.brand-sub { font-size: .78rem; color: var(--text-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: var(--s2); padding: 10px 12px; border-radius: var(--radius-sm); color: var(--text-2); text-decoration: none; font-weight: 500; min-height: 44px; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary-strong); }
.nav a .count { margin-left: auto; font-size: .75rem; background: var(--accent-soft); color: var(--accent-text); border-radius: 999px; padding: 0 8px; font-weight: 600; }
.nav svg { width: 20px; height: 20px; flex: none; }
.nav-sep { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: var(--s3) 12px var(--s1); }
.sidebar-foot { margin-top: auto; padding: var(--s2); font-size: .8rem; color: var(--text-3); }
.main { min-width: 0; }
.topbar { display: none; }
.content { max-width: 1120px; margin: 0 auto; padding: var(--s5) var(--s4) var(--s6); }
.content.narrow { max-width: 860px; }
.page-head { margin-bottom: var(--s4); }
.page-head p { color: var(--text-2); max-width: var(--measure); }
.crumbs { font-size: .85rem; color: var(--text-3); margin-bottom: var(--s2); }
.crumbs a { color: var(--text-3); }
.prose { max-width: var(--measure); }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(86vw, 300px); z-index: 50; transform: translateX(-105%); transition: transform .2s ease; box-shadow: var(--shadow-2); }
  .sidebar.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(20, 12, 6, .45); z-index: 40; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 30; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .content { padding: var(--s3) var(--s3) var(--s6); }
}

/* ---------- componentes ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--s4); box-shadow: var(--shadow-1); }
.card.tight { padding: var(--s3); }
.card.flat { box-shadow: none; }
.card.hl { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset, var(--shadow-1); }
.card h3 { margin-bottom: var(--s2); }
.card-kicker { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); font-weight: 600; margin-bottom: var(--s1); }
@media (max-width: 600px) { .card { padding: var(--s3); } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 600 .95rem/1.2 var(--font); cursor: pointer; text-decoration: none; transition: background .12s, border-color .12s, transform .06s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-strong); border-color: var(--primary-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--error); border-color: var(--error); background: transparent; }
.btn.danger:hover { background: var(--error-soft); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .85rem; }
.btn svg { width: 18px; height: 18px; }
.icon-btn { min-width: 44px; padding: 0; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
.badge.prof { background: var(--info-soft); color: var(--info); border-color: transparent; }
.badge.comp { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.badge.ok { background: var(--success-soft); color: var(--success); border-color: transparent; }
.badge.bad { background: var(--error-soft); color: var(--error); border-color: transparent; }
.badge.primary { background: var(--primary-soft); color: var(--primary-strong); border-color: transparent; }

.note { border-left: 4px solid var(--info); background: var(--info-soft); padding: var(--s3); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 0 0 var(--s3); }
.note.correction { border-color: var(--accent); background: var(--accent-soft); }
.note.ok { border-color: var(--success); background: var(--success-soft); }
.note.bad { border-color: var(--error); background: var(--error-soft); }
.limit { color: var(--text-2); font-size: .95rem; border-left: 3px solid var(--border-strong); padding-left: var(--s3); }

.tbl { width: 100%; border-collapse: collapse; margin: 0 0 var(--s3); font-size: .93rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); background: var(--surface-2); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: var(--s3); border-radius: var(--radius-sm); }
.tbl-wrap .tbl { margin: 0; min-width: 480px; }

.progress { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }
.progress.accent > span { background: var(--accent); }
.progress.ok > span { background: var(--success); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.stat .l { font-size: .8rem; color: var(--text-3); }

/* formulário */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: .85rem; font-weight: 600; color: var(--text-2); }
.input, select.input, textarea.input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font: 1rem var(--mono); }
.input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
.input.ok { border-color: var(--success); background: var(--success-soft); }
.input.bad { border-color: var(--error); background: var(--error-soft); }
.fields { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.choices { display: grid; gap: var(--s2); }
.choice { display: flex; gap: var(--s2); align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); cursor: pointer; background: var(--surface); min-height: 44px; }
.choice:hover { background: var(--surface-2); }
.choice input { margin-top: 4px; accent-color: var(--primary); width: 18px; height: 18px; flex: none; }
.choice.sel { border-color: var(--primary); background: var(--primary-soft); }
.choice.ok { border-color: var(--success); background: var(--success-soft); }
.choice.bad { border-color: var(--error); background: var(--error-soft); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s2) 0; }
input[type="range"] { accent-color: var(--primary); width: 100%; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: var(--s3); overflow-x: auto; scrollbar-width: thin; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font: 600 .92rem var(--font); color: var(--text-3); cursor: pointer; white-space: nowrap; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--primary-strong); border-bottom-color: var(--primary); }

/* questão */
.q { display: flex; flex-direction: column; gap: var(--s3); }
.q-meta { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.q-prompt { font-size: 1.04rem; }
.hint { background: var(--accent-soft); border-radius: var(--radius-sm); padding: 10px 14px; font-size: .95rem; }
.hint b { color: var(--accent-text); }
.fb { border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.fb-head { padding: 12px var(--s3); font-weight: 700; display: flex; align-items: center; gap: var(--s2); }
.fb-head.ok { background: var(--success-soft); color: var(--success); }
.fb-head.bad { background: var(--error-soft); color: var(--error); }
.fb-head.mid { background: var(--accent-soft); color: var(--accent-text); }
.fb-body { padding: var(--s3); display: grid; gap: var(--s2); }
.fb-row { display: grid; grid-template-columns: 170px 1fr; gap: var(--s2); }
.fb-row > b { color: var(--text-3); font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
@media (max-width: 600px) { .fb-row { grid-template-columns: 1fr; gap: 0; } }
.steps { margin: 0; padding-left: 1.4em; } .steps li { margin: .35em 0; }
.ans-list { display: grid; gap: 4px; }
.ans-list div { font-family: var(--mono); font-size: .92rem; }

/* worked example */
.worked { counter-reset: st; display: grid; gap: var(--s2); }
.worked .st { display: grid; grid-template-columns: 32px 1fr; gap: var(--s2); align-items: start; }
.worked .st::before { counter-increment: st; content: counter(st); width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-strong); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.worked .why { color: var(--text-3); font-size: .9rem; }

/* módulo: trilha de etapas */
.steps-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--s4); }
.steps-nav a { font-size: .8rem; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); text-decoration: none; border: 1px solid var(--border); }
.steps-nav a:hover { background: var(--surface-3); }
.section { scroll-margin-top: 80px; margin-bottom: var(--s4); }
.section-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
.section-num { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; }
.section-head h2 { margin: 0; font-size: 1.15rem; }

/* saiba mais */
.sm-btn { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 var(--s3); padding: 6px 12px; min-height: 36px; border-radius: 999px; border: 1px dashed var(--accent); background: transparent; color: var(--accent-text); font: 600 .85rem var(--font); cursor: pointer; }
.sm-btn:hover { background: var(--accent-soft); }
.sm-btn svg { width: 16px; height: 16px; }
.sm-panel { border: 1px solid var(--accent); border-radius: var(--radius); background: var(--surface); margin: 0 0 var(--s3); overflow: hidden; }
.sm-panel header { display: flex; align-items: center; gap: var(--s2); padding: 12px var(--s3); background: var(--accent-soft); }
.sm-panel header h3 { margin: 0; font-size: 1rem; flex: 1; }
.sm-panel .sm-body { padding: var(--s3); display: grid; gap: var(--s3); }
.sm-panel .sm-item h4 { margin: 0 0 4px; font-size: .9rem; color: var(--accent-text); }
.sm-panel .sm-item p { margin: 0; }
@media (max-width: 600px) {
  .sm-panel.modal { position: fixed; inset: auto 0 0 0; max-height: 85vh; overflow-y: auto; z-index: 60; border-radius: var(--radius-lg) var(--radius-lg) 0 0; margin: 0; box-shadow: var(--shadow-2); }
  .sm-panel.modal header { position: sticky; top: 0; }
}

/* terminal */
.term { background: var(--term-bg); color: var(--term-text); border-radius: var(--radius); font: .88rem/1.45 var(--mono); display: flex; flex-direction: column; min-height: 360px; max-height: 560px; }
.term-tabs { display: flex; gap: 2px; padding: 6px 6px 0; overflow-x: auto; }
.term-tabs button { background: transparent; color: var(--term-dim); border: 0; padding: 8px 14px; border-radius: 8px 8px 0 0; font: 600 .82rem var(--font); cursor: pointer; min-height: 36px; }
.term-tabs button[aria-selected="true"] { background: rgba(255, 255, 255, .08); color: var(--term-text); }
.term-out { flex: 1; overflow-y: auto; padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
.term-out .cmd { color: var(--term-text); }
.term-out .err { color: var(--term-err); }
.term-out .sys { color: var(--term-dim); }
.term-in { display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255, 255, 255, .1); padding: 8px 14px; }
.term-in label { color: var(--term-ok); white-space: nowrap; }
.term-in input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--term-text); font: inherit; min-height: 36px; outline: none; }
.term-in input:focus-visible { outline: none; }
.term:focus-within { box-shadow: 0 0 0 3px var(--focus); }

/* simulações */
.sim { display: grid; gap: var(--s3); }
.sim-stage { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--s2); overflow: hidden; }
.sim-stage svg { width: 100%; height: auto; display: block; }
.sim-controls { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.sim-caption { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; min-height: 72px; }
.sim-caption .k { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; }
.sim-steps { display: flex; gap: 4px; flex-wrap: wrap; }
.sim-steps button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface); font: 600 .78rem var(--font); color: var(--text-2); cursor: pointer; }
.sim-steps button[aria-current="step"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.sim-steps button.done { background: var(--primary-soft); border-color: var(--primary-soft); color: var(--primary-strong); }
svg .node rect, svg .node circle { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }
svg .node text, svg text { fill: var(--text); font-family: var(--font); }
svg .lbl { font-size: 12px; fill: var(--text-2); }
svg .lbl-s { font-size: 10.5px; fill: var(--text-3); }
svg .link { stroke: var(--border-strong); stroke-width: 3; fill: none; }
svg .link.trunk { stroke: var(--accent); stroke-width: 5; }
svg .link.blocked { stroke: var(--error); stroke-dasharray: 6 6; }

/* ===== 10-ipv4.js ===== */
/* ==========================================================================
   Engine IPv4 / CIDR / sumarização — funções puras, sem DOM
   ========================================================================== */
const IPv4 = (() => {
  function toInt(s) {
    if (typeof s !== 'string') return null;
    const p = s.trim().split('.');
    if (p.length !== 4) return null;
    let n = 0;
    for (const x of p) {
      if (!/^\d{1,3}$/.test(x)) return null;
      const v = Number(x);
      if (v > 255) return null;
      n = n * 256 + v;
    }
    return n >>> 0;
  }
  const toStr = n => [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
  const maskInt = p => (p <= 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0);
  const maskStr = p => toStr(maskInt(p));
  const wildcardStr = p => toStr((~maskInt(p)) >>> 0);
  const blockSize = p => 2 ** (32 - p);

  /** Prefixo a partir de máscara decimal; null se não for contígua. */
  function prefixFromMask(s) {
    const m = toInt(s);
    if (m === null) return null;
    const inv = (~m) >>> 0;
    if (((inv + 1) & inv) !== 0) return null; // inv deve ser 2^k - 1
    let p = 0;
    for (let i = 31; i >= 0; i--) if ((m >>> i) & 1) p++; else break;
    return p;
  }

  /** Aceita "/26", "26", "255.255.255.192". */
  function parsePrefix(s) {
    if (typeof s !== 'string') return null;
    const t = s.trim();
    const m = t.match(/^\/?\s*(\d{1,2})$/);
    if (m) { const v = Number(m[1]); return v >= 0 && v <= 32 ? v : null; }
    return prefixFromMask(t);
  }

  /** Aceita "a.b.c.d/p" ou "a.b.c.d máscara". */
  function parseCidr(s) {
    const m = String(s).trim().match(/^(\S+?)\s*(?:\/|\s)\s*(\S+)$/);
    if (!m) return null;
    const ip = toInt(m[1]);
    const p = parsePrefix(m[2]);
    if (ip === null || p === null) return null;
    return { ip, prefix: p };
  }

  const network = (ip, p) => (ip & maskInt(p)) >>> 0;
  const broadcast = (ip, p) => (network(ip, p) | ((~maskInt(p)) >>> 0)) >>> 0;
  const isAligned = (ip, p) => network(ip, p) === (ip >>> 0);

  /** Hosts utilizáveis. Convencional: 2^h − 2. /31 (RFC 3021) = 2; /32 = 1 endereço. */
  function usableHosts(p) {
    if (p === 32) return 1;
    if (p === 31) return 2;
    return 2 ** (32 - p) - 2;
  }

  /** Octeto "interessante": onde a máscara deixa de ser 255. Índice 0..3. */
  function interestingOctet(p) {
    if (p >= 32) return 3;
    return Math.floor(p / 8);
  }
  function jump(p) {
    const idx = interestingOctet(p);
    const octet = (maskInt(p) >>> (24 - idx * 8)) & 255;
    return { octetIndex: idx, maskOctet: octet, jump: 256 - octet };
  }

  function info(ip, p) {
    const net = network(ip, p), bc = broadcast(ip, p);
    let first, last;
    if (p === 32) { first = last = net; }
    else if (p === 31) { first = net; last = bc; }
    else { first = net + 1; last = bc - 1; }
    return {
      ip, prefix: p, mask: maskStr(p), network: net, broadcast: bc,
      first: first >>> 0, last: last >>> 0, total: blockSize(p), usable: usableHosts(p),
      ...jump(p),
    };
  }

  /** Menor prefixo (bloco) que comporta n hosts utilizáveis (convencional, h ≥ 2). */
  function minPrefixForHosts(n) {
    for (let h = 2; h <= 32; h++) if (2 ** h - 2 >= n) return 32 - h;
    return null;
  }
  /** Bits a emprestar para obter pelo menos k sub-redes. */
  const bitsForSubnets = k => (k <= 1 ? 0 : Math.ceil(Math.log2(k) - 1e-9));

  const octetBin = v => v.toString(2).padStart(8, '0');
  const toBin = n => [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].map(octetBin).join('.');

  /** Classe histórica pelo primeiro octeto. */
  function classOf(ipOrOctet) {
    const o = typeof ipOrOctet === 'number' && ipOrOctet <= 255 ? ipOrOctet : (ipOrOctet >>> 24);
    if (o === 0) return { cls: 'Especial', note: '0.0.0.0/8 — "esta rede" (reservado)', defPrefix: null };
    if (o <= 126) return { cls: 'A', defPrefix: 8 };
    if (o === 127) return { cls: 'Loopback', note: '127.0.0.0/8 é reservado para loopback (faixa da antiga classe A)', defPrefix: 8 };
    if (o <= 191) return { cls: 'B', defPrefix: 16 };
    if (o <= 223) return { cls: 'C', defPrefix: 24 };
    if (o <= 239) return { cls: 'D', note: 'Multicast', defPrefix: null };
    return { cls: 'E', note: 'Reservado/experimental', defPrefix: null };
  }

  function isPrivate(ip) {
    return network(ip, 8) === toInt('10.0.0.0') ||
      network(ip, 12) === toInt('172.16.0.0') ||
      network(ip, 16) === toInt('192.168.0.0');
  }

  const overlaps = (a, pa, b, pb) => {
    const p = Math.min(pa, pb);
    return network(a, p) === network(b, p);
  };

  /**
   * Sumarização: menor prefixo único que cobre todas as redes.
   * exact = true se o resumo cobre exatamente as redes dadas (sem endereços extras).
   */
  function summarize(nets) {
    if (!nets.length) return null;
    const norm = nets.map(n => ({ net: network(n.net, n.prefix), prefix: n.prefix }));
    const lo = Math.min(...norm.map(n => n.net));
    const hi = Math.max(...norm.map(n => broadcast(n.net, n.prefix)));
    // maior prefixo cujo bloco contém o menor e o maior endereço
    let p = Math.min(...norm.map(n => n.prefix));
    while (p > 0 && network(lo, p) !== network(hi, p)) p--;
    const sumNet = network(lo, p);
    // cobertura: soma dos tamanhos sem sobreposição
    const sorted = [...norm].sort((x, y) => x.net - y.net);
    let covered = 0, overlap = false, cursor = -1;
    for (const n of sorted) {
      const s = n.net, e = broadcast(n.net, n.prefix);
      if (s <= cursor) overlap = true;
      covered += blockSize(n.prefix);
      cursor = Math.max(cursor, e);
    }
    const exact = !overlap && covered === blockSize(p);
    return { net: sumNet, prefix: p, exact, extra: exact ? 0 : blockSize(p) - covered, overlap };
  }

  /** Passos explicativos para rede/broadcast pelo método do salto. */
  function explainSteps(ip, p) {
    const i = info(ip, p);
    const oct = ['1º', '2º', '3º', '4º'][i.octetIndex];
    const ipOct = (ip >>> (24 - i.octetIndex * 8)) & 255;
    const start = Math.floor(ipOct / i.jump) * i.jump;
    const steps = [];
    steps.push(`/${p} = ${i.mask}. Bits de host: 32 − ${p} = ${32 - p}.`);
    if (p % 8 === 0 && p < 32) {
      steps.push(`A máscara termina exatamente num octeto: o ${oct} octeto da máscara é 0, então o "salto" é 256 e o bloco começa em 0 nesse octeto.`);
    } else {
      steps.push(`O octeto interessante é o ${oct} (onde a máscara vale ${i.maskOctet}). Salto = 256 − ${i.maskOctet} = ${i.jump}.`);
    }
    steps.push(`No ${oct} octeto o IP vale ${ipOct}. Múltiplo de ${i.jump} imediatamente ≤ ${ipOct}: ${start} (próximo bloco começaria em ${start + i.jump}).`);
    steps.push(`Rede: ${toStr(i.network)} (bits de host = 0 → octetos seguintes viram 0).`);
    steps.push(`Broadcast: um antes do próximo bloco → ${toStr(i.broadcast)} (bits de host = 1 → octetos seguintes viram 255).`);
    if (p <= 30) steps.push(`Hosts: ${toStr(i.first)} até ${toStr(i.last)} → 2^${32 - p} − 2 = ${i.usable} utilizáveis.`);
    return steps;
  }

  return {
    toInt, toStr, maskInt, maskStr, wildcardStr, blockSize, prefixFromMask, parsePrefix, parseCidr,
    network, broadcast, isAligned, usableHosts, interestingOctet, jump, info, minPrefixForHosts,
    bitsForSubnets, octetBin, toBin, classOf, isPrivate, overlaps, summarize, explainSteps,
  };
})();

/* ===== 11-vlsm.js ===== */
/* ==========================================================================
   Engine VLSM — alocação, validação e explicação (puro)
   ========================================================================== */
const VLSM = (() => {
  const { network, broadcast, blockSize, minPrefixForHosts, toStr, maskStr, isAligned, usableHosts } = IPv4;

  /**
   * Aloca demandas (maior → menor), cada uma na próxima fronteira válida.
   * demands: [{name, hosts}] ; retorna {ok, allocations:[{name,hosts,prefix,net,bc,first,last,size}], error, used, free}
   */
  function allocate(baseNet, basePrefix, demands) {
    const base = network(baseNet, basePrefix);
    const end = broadcast(base, basePrefix);
    const order = demands.map((d, i) => ({ ...d, _i: i }))
      .sort((a, b) => b.hosts - a.hosts || a._i - b._i);
    let cursor = base;
    const allocations = [];
    for (const d of order) {
      const p = minPrefixForHosts(d.hosts);
      if (p === null || p < basePrefix) return { ok: false, allocations, error: `A demanda ${d.name} (${d.hosts} hosts) não cabe em /${basePrefix}.` };
      const size = blockSize(p);
      const aligned = Math.ceil((cursor - base) / size) * size + base;
      if (aligned + size - 1 > end) return { ok: false, allocations, error: `Espaço insuficiente para ${d.name} (${d.hosts} hosts, /${p}).` };
      allocations.push({ name: d.name, hosts: d.hosts, prefix: p, net: aligned, bc: aligned + size - 1, first: aligned + 1, last: aligned + size - 2, size, mask: maskStr(p) });
      cursor = aligned + size;
    }
    const used = allocations.reduce((s, a) => s + a.size, 0);
    return { ok: true, allocations, used, free: blockSize(basePrefix) - used, next: cursor <= end ? cursor : null };
  }

  /** Verifica sobreposição em lista [{net,prefix,name}] */
  function findOverlaps(list) {
    const out = [];
    for (let i = 0; i < list.length; i++)
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        if (IPv4.overlaps(a.net, a.prefix, b.net, b.prefix)) out.push([a.name, b.name]);
      }
    return out;
  }

  /** Diagnóstico de uma sub-rede escrita pelo aluno (ex.: 192.168.1.32/26). */
  function checkAlignment(net, prefix) {
    if (isAligned(net, prefix)) return { aligned: true };
    const real = network(net, prefix);
    const size = blockSize(prefix);
    return { aligned: false, realNetwork: real, nextValid: real + size, size };
  }

  /** Passos explicativos de uma alocação completa */
  function explain(baseNet, basePrefix, demands) {
    const r = allocate(baseNet, basePrefix, demands);
    const steps = [];
    const order = [...demands].sort((a, b) => b.hosts - a.hosts);
    steps.push(`Ordene as demandas da maior para a menor: ${order.map(d => `${d.name}=${d.hosts}`).join(', ')}.`);
    for (const a of r.allocations) {
      const h = 32 - a.prefix;
      steps.push(`${a.name}: precisa de ${a.hosts} hosts → menor 2^h − 2 ≥ ${a.hosts} é h=${h} (${2 ** h - 2} hosts) → /${a.prefix} (bloco de ${a.size}). Próxima fronteira múltipla de ${a.size}: ${toStr(a.net)}. Broadcast ${toStr(a.bc)}.`);
    }
    if (r.ok) steps.push(`Espaço usado: ${r.used} de ${blockSize(basePrefix)} endereços; livre a partir de ${r.next !== null ? toStr(r.next) : '—'}.`);
    else steps.push(r.error);
    return { result: r, steps };
  }

  return { allocate, findOverlaps, checkAlignment, explain, usableHosts };
})();

/* ===== 12-ipv6.js ===== */
/* ==========================================================================
   Engine IPv6 — expandir, abreviar (RFC 5952), classificar (puro)
   ========================================================================== */
const IPv6 = (() => {
  /** Retorna array de 8 números (0..65535) ou null se inválido. */
  function parse(s) {
    if (typeof s !== 'string') return null;
    let t = s.trim().toLowerCase();
    const slash = t.indexOf('/');
    if (slash >= 0) t = t.slice(0, slash);
    if (!/^[0-9a-f:]+$/.test(t)) return null;
    const dbl = t.split('::');
    if (dbl.length > 2) return null; // "::" no máximo uma vez
    const head = dbl[0] ? dbl[0].split(':') : [];
    const tail = dbl.length === 2 && dbl[1] ? dbl[1].split(':') : [];
    const all = [...head, ...tail];
    if (all.some(g => !/^[0-9a-f]{1,4}$/.test(g))) return null;
    if (dbl.length === 1 && head.length !== 8) return null;
    if (dbl.length === 2 && head.length + tail.length > 7) return null;
    const fill = dbl.length === 2 ? 8 - head.length - tail.length : 0;
    return [...head, ...Array(fill).fill('0'), ...tail].map(g => parseInt(g, 16));
  }

  const expand = s => { const g = parse(s); return g ? g.map(x => x.toString(16).padStart(4, '0')).join(':') : null; };

  /** Forma canônica RFC 5952: minúsculas, sem zeros à esquerda, :: na maior sequência (≥2) de zeros; empate → primeira. */
  function compress(s) {
    const g = Array.isArray(s) ? s : parse(s);
    if (!g) return null;
    let bestStart = -1, bestLen = 0;
    for (let i = 0; i < 8;) {
      if (g[i] !== 0) { i++; continue; }
      let j = i; while (j < 8 && g[j] === 0) j++;
      if (j - i > bestLen) { bestStart = i; bestLen = j - i; }
      i = j;
    }
    const hex = g.map(x => x.toString(16));
    if (bestLen < 2) return hex.join(':');
    const left = hex.slice(0, bestStart).join(':');
    const right = hex.slice(bestStart + bestLen).join(':');
    return `${left}::${right}`;
  }

  /** Igualdade semântica (duas grafias do mesmo endereço). */
  const equal = (a, b) => { const x = parse(a), y = parse(b); return !!x && !!y && x.every((v, i) => v === y[i]); };

  function inPrefix(g, prefixGroups, bits) {
    let remaining = bits;
    for (let i = 0; i < 8 && remaining > 0; i++) {
      const take = Math.min(16, remaining);
      const mask = take === 16 ? 0xffff : (0xffff << (16 - take)) & 0xffff;
      if ((g[i] & mask) !== (prefixGroups[i] & mask)) return false;
      remaining -= take;
    }
    return true;
  }

  const TYPES = [
    { id: 'unspecified', name: 'Não especificado', prefix: '::', bits: 128 },
    { id: 'loopback', name: 'Loopback', prefix: '::1', bits: 128 },
    { id: 'multicast', name: 'Multicast', prefix: 'ff00::', bits: 8 },
    { id: 'link-local', name: 'Link-local unicast', prefix: 'fe80::', bits: 10 },
    { id: 'ula', name: 'Unique local (ULA)', prefix: 'fc00::', bits: 7 },
    { id: 'documentation', name: 'Documentação (global unicast reservado a exemplos)', prefix: '2001:db8::', bits: 32 },
    { id: 'global', name: 'Global unicast', prefix: '2000::', bits: 3 },
  ];

  /** Classifica pelo prefixo. Anycast não é identificável pelo formato (usa espaço unicast). */
  function classify(s) {
    const g = parse(s);
    if (!g) return null;
    for (const t of TYPES) if (inPrefix(g, parse(t.prefix), t.bits)) return { ...t, cidr: `${t.prefix}/${t.bits}` };
    return { id: 'other', name: 'Outro/reservado', cidr: '' };
  }

  function explainCompress(s) {
    const g = parse(s);
    if (!g) return ['Endereço inválido.'];
    const steps = [];
    steps.push(`Grupos: ${g.map(x => x.toString(16).padStart(4, '0')).join(' : ')}`);
    steps.push(`1) Retire zeros à esquerda de cada grupo: ${g.map(x => x.toString(16)).join(':')}`);
    const c = compress(g);
    if (c.includes('::')) steps.push(`2) Troque a MAIOR sequência contínua de grupos 0 (com 2 ou mais grupos; empate → a primeira) por "::" uma única vez: ${c}`);
    else steps.push('2) Não há sequência de 2+ grupos zerados; não se usa "::" para um único grupo 0 (forma canônica RFC 5952).');
    return steps;
  }

  return { parse, expand, compress, equal, classify, explainCompress, TYPES };
})();

/* ===== 13-stp.js ===== */
/* ==========================================================================
   Engine STP (802.1D clássico) — eleição de root, root ports, designated
   Desempates: menor BID (prioridade, depois MAC) → menor custo até a raiz →
   menor BID do vizinho que envia a BPDU → menor Port ID do vizinho → menor Port ID local.
   ========================================================================== */
const STP = (() => {
  /** Custos curtos 802.1D-1998 por velocidade (Mb/s). */
  const COSTS = { 10: 100, 100: 19, 1000: 4, 10000: 2 };

  const macKey = m => m.toLowerCase().replace(/[^0-9a-f]/g, '').padStart(12, '0');
  /** Compara BIDs: prioridade primeiro, depois MAC (como número hexadecimal). */
  function cmpBid(a, b) {
    if (a.priority !== b.priority) return a.priority - b.priority;
    const x = macKey(a.mac), y = macKey(b.mac);
    return x < y ? -1 : x > y ? 1 : 0;
  }
  const cmpTuple = (a, b) => { for (let i = 0; i < a.length; i++) { const d = typeof a[i] === 'number' ? a[i] - b[i] : (a[i] < b[i] ? -1 : a[i] > b[i] ? 1 : 0); if (d) return d; } return 0; };

  /**
   * switches: [{id, priority, mac}]
   * links: [{id, a, pa, b, pb, cost, up}]  — pa/pb: {name, num} (num = número usado no Port ID; prioridade de porta 128)
   * retorna { roots:{componentRoot por switch}, cost:{}, ports: {"sw|portName": {role, state, link}}, rootPort:{}, explain:[] }
   */
  function compute(switches, links) {
    const sw = Object.fromEntries(switches.map(s => [s.id, s]));
    const up = links.filter(l => l.up !== false);
    const adj = Object.fromEntries(switches.map(s => [s.id, []]));
    for (const l of up) {
      adj[l.a].push({ link: l, me: l.pa, nb: l.b, nbPort: l.pb });
      adj[l.b].push({ link: l, me: l.pb, nb: l.a, nbPort: l.pa });
    }
    // componentes conectados
    const comp = {}; let c = 0;
    for (const s of switches) {
      if (comp[s.id] !== undefined) continue;
      const stack = [s.id]; comp[s.id] = c;
      while (stack.length) { const x = stack.pop(); for (const e of adj[x]) if (comp[e.nb] === undefined) { comp[e.nb] = c; stack.push(e.nb); } }
      c++;
    }
    const rootOf = {};
    for (let k = 0; k < c; k++) {
      const members = switches.filter(s => comp[s.id] === k).sort(cmpBid);
      for (const m of members) rootOf[m.id] = members[0].id;
    }
    // Dijkstra por componente
    const cost = {};
    for (const s of switches) cost[s.id] = s.id === rootOf[s.id] ? 0 : Infinity;
    const done = new Set();
    while (done.size < switches.length) {
      let best = null;
      for (const s of switches) if (!done.has(s.id) && (best === null || cost[s.id] < cost[best])) best = s.id;
      if (best === null || cost[best] === Infinity) break;
      done.add(best);
      for (const e of adj[best]) if (cost[best] + e.link.cost < cost[e.nb]) cost[e.nb] = cost[best] + e.link.cost;
    }
    const portId = p => 128 * 1000 + p.num;
    const ports = {}; const rootPort = {}; const explain = [];
    // Root ports
    for (const s of switches) {
      if (s.id === rootOf[s.id]) { explain.push(`${s.id} é a Root Bridge (menor BID: prioridade ${s.priority}, MAC ${s.mac}). Root Bridge não tem Root Port.`); continue; }
      let bestE = null, bestT = null;
      for (const e of adj[s.id]) {
        const t = [cost[e.nb] + e.link.cost, sw[e.nb].priority, macKey(sw[e.nb].mac), portId(e.nbPort), portId(e.me)];
        if (bestT === null || cmpTuple(t, bestT) < 0) { bestT = t; bestE = e; }
      }
      if (bestE) {
        rootPort[s.id] = bestE.me.name;
        const cands = adj[s.id].map(e => `${e.me.name}: custo ${cost[e.nb] + e.link.cost} via ${e.nb}`).join('; ');
        explain.push(`${s.id}: candidatos ${cands} → Root Port = ${bestE.me.name}${adj[s.id].filter(e => cost[e.nb] + e.link.cost === bestT[0]).length > 1 ? ' (empate de custo resolvido pelo menor BID do vizinho e depois Port ID)' : ''}.`);
      }
    }
    // Designated por segmento
    for (const l of links) {
      if (l.up === false) {
        ports[`${l.a}|${l.pa.name}`] = { role: 'disabled', state: 'disabled', link: l.id };
        ports[`${l.b}|${l.pb.name}`] = { role: 'disabled', state: 'disabled', link: l.id };
        continue;
      }
      const ta = [cost[l.a], sw[l.a].priority, macKey(sw[l.a].mac), portId(l.pa)];
      const tb = [cost[l.b], sw[l.b].priority, macKey(sw[l.b].mac), portId(l.pb)];
      const aWins = cmpTuple(ta, tb) < 0;
      const [dSw, dP, oSw, oP] = aWins ? [l.a, l.pa, l.b, l.pb] : [l.b, l.pb, l.a, l.pa];
      ports[`${dSw}|${dP.name}`] = { role: 'designated', state: 'forwarding', link: l.id };
      const isRP = rootPort[oSw] === oP.name;
      ports[`${oSw}|${oP.name}`] = isRP ? { role: 'root', state: 'forwarding', link: l.id } : { role: 'blocked', state: 'blocking', link: l.id };
      if (!isRP) explain.push(`Enlace ${l.a}(${l.pa.name})–${l.b}(${l.pb.name}): designada = ${dSw} ${dP.name} (custo até a raiz ${cost[dSw]} vs ${cost[oSw]}${cost[dSw] === cost[oSw] ? ', empate → menor BID' : ''}). ${oSw} ${oP.name} não é Root nem Designada → bloqueada (802.1D: Blocking; RSTP: Alternate/Discarding).`);
    }
    return { rootOf, cost, ports, rootPort, explain };
  }

  return { compute, cmpBid, COSTS, macKey };
})();

/* ===== 14-adaptive.js ===== */
/* ==========================================================================
   Motor adaptativo — domínio estimado, prioridade explicável, replanejamento
   Heurística transparente (não é um modelo científico validado).
   ========================================================================== */
const Adaptive = (() => {
  const T = () => CONFIG.topics;
  const topicById = id => CONFIG.topics.find(t => t.id === id);
  const groupById = id => CONFIG.groups.find(g => g.id === id);
  const clamp01 = x => Math.max(0, Math.min(1, x));

  function newTopicRecord(id) {
    const t = topicById(id);
    return {
      topicId: id, status: 'new', attempts: 0, independentCorrect: 0, assistedCorrect: 0, incorrect: 0,
      unknown: 0, recentPerformance: [], prerequisiteTopics: [...t.prereq], lastReviewedAt: null,
      estimatedStudyMinutes: 0, actualStudyMinutes: 0, masteryScore: 0, nextReviewAt: null,
      vlsmProblems: [], labConfigs: 0, diagnostic: null,
    };
  }

  const VALUE = { independent: 1, assisted: 0.4, incorrect: 0, unknown: 0 };

  /** Registra uma tentativa (puro: retorna novo registro). result: independent|assisted|incorrect|unknown */
  function recordAttempt(rec, { result, kind = 'geral', sig = '', fullVlsm = false, now = Date.now(), diagnostic = false }) {
    const r = { ...rec, recentPerformance: [...rec.recentPerformance], vlsmProblems: [...(rec.vlsmProblems || [])] };
    r.attempts++;
    if (result === 'independent') r.independentCorrect++;
    else if (result === 'assisted') r.assistedCorrect++;
    else if (result === 'incorrect') r.incorrect++;
    else r.unknown++;
    r.recentPerformance.push({ v: VALUE[result], result, kind, sig, at: now });
    if (r.recentPerformance.length > 10) r.recentPerformance.shift();
    if (fullVlsm && result === 'independent' && sig && !r.vlsmProblems.includes(sig)) r.vlsmProblems.push(sig);
    if (diagnostic) r.diagnostic = result;
    r.lastReviewedAt = now;
    // revisão: acerto independente empurra a próxima revisão; erro traz para perto
    const mins = result === 'independent' ? 60 : result === 'assisted' ? 20 : 10;
    r.nextReviewAt = now + mins * 60000;
    r.masteryScore = mastery(r);
    r.status = status(r);
    return r;
  }

  /** Estimador suavizado: média com prior + peso crescente dos 5 últimos resultados. */
  function mastery(r) {
    const base = (r.independentCorrect + 0.4 * r.assistedCorrect + 0.5) / (r.attempts + 2);
    const recent = r.recentPerformance.slice(-5);
    if (!recent.length) return base;
    const w = 0.5 * recent.length / 5;
    const avg = recent.reduce((s, x) => s + x.v, 0) / recent.length;
    return clamp01(base * (1 - w) + avg * w);
  }

  /** Critérios de domínio provisório (seção 15). */
  function masteryCriteria(r) {
    const last5 = r.recentPerformance.slice(-5);
    const indep = last5.filter(x => x.result === 'independent').length;
    const kinds = new Set(last5.map(x => x.kind)).size;
    const base = last5.length >= 5 && indep >= 4 && kinds >= 2;
    const t = r.topicId;
    if (t === 'vlsm') return { ok: (r.vlsmProblems || []).length >= 2, detail: `${(r.vlsmProblems || []).length}/2 problemas VLSM completos resolvidos sozinho` };
    if (t === 'ios') return { ok: base && r.labConfigs >= 1, detail: `${indep}/5 acertos independentes recentes; ${r.labConfigs} configuração(ões) válida(s) no laboratório` };
    return { ok: base, detail: `${indep} acertos independentes nas últimas ${last5.length} (meta: 4 de 5, com pelo menos 2 tipos de questão; tipos: ${kinds})` };
  }

  function status(r) {
    if (r.attempts === 0) return 'new';
    if (masteryCriteria(r).ok) return 'mastered';
    return mastery(r) < 0.5 ? 'learning' : 'practicing';
  }

  /** Descendentes transitivos de um tópico no grafo de pré-requisitos. */
  function descendants(id) {
    const out = new Set(); const stack = [id];
    while (stack.length) {
      const x = stack.pop();
      for (const t of T()) if (t.prereq.includes(x) && !out.has(t.id)) { out.add(t.id); stack.push(t.id); }
    }
    return [...out];
  }
  const importanceOf = (id, settings) => {
    const t = topicById(id);
    const over = settings && settings.importance && settings.importance[t.group];
    return over !== undefined ? over : groupById(t.group).importance;
  };
  const maxDescImportance = settings => Math.max(...T().map(t => descendants(t.id).reduce((s, d) => s + importanceOf(d, settings), 0)), 1e-9);

  function trailingErrors(r) {
    let n = 0;
    for (let i = r.recentPerformance.length - 1; i >= 0; i--) { if (r.recentPerformance[i].v === 0) n++; else break; }
    return n;
  }

  /**
   * Calcula fatores e prioridade de todos os tópicos.
   * ctx: { topics:{id:rec}, settings, now, dueCards:{topicId:n}, recHistory:[topicId], mode, block:{topics}, remainingMinutes, examDone }
   */
  function scoreAll(ctx) {
    const settings = ctx.settings || {};
    const W = settings.weights || CONFIG.defaults.weights;
    const gate = settings.gateThreshold ?? CONFIG.defaults.gateThreshold;
    const maxDesc = maxDescImportance(settings);
    const rec = id => ctx.topics[id] || newTopicRecord(id);
    const rows = [];
    for (const t of T()) {
      const r = rec(t.id);
      const m = mastery(r);
      const crit = masteryCriteria(r);
      const importance = importanceOf(t.id, settings);
      const confidence = Math.min(1, r.attempts / 5);
      // lacuna: 1 − domínio; com poucos dados, puxa para 0,75 (incerteza alta)
      const learningGap = clamp01((1 - m) * confidence + 0.75 * (1 - confidence));
      const descs = descendants(t.id);
      const openDescImp = descs.filter(d => !masteryCriteria(rec(d)).ok).reduce((s, d) => s + importanceOf(d, settings), 0);
      const prerequisiteRelevance = clamp01(openDescImp / maxDesc);
      const due = (ctx.dueCards && ctx.dueCards[t.id]) || 0;
      const overdue = r.nextReviewAt && ctx.now >= r.nextReviewAt && r.attempts > 0 ? 1 : 0;
      const errStreak = trailingErrors(r);
      const reviewUrgency = clamp01(Math.min(due / 5, 1) * 0.4 + Math.min(errStreak / 3, 1) * 0.4 + overdue * 0.2);
      let score = importance * W.importance + learningGap * W.gap + prerequisiteRelevance * W.prereq + reviewUrgency * W.urgency;
      // anti-repetição
      let consecutive = 0;
      for (let i = (ctx.recHistory || []).length - 1; i >= 0 && ctx.recHistory[i] === t.id; i--) consecutive++;
      const repeatPenalty = Math.max(0, consecutive - 2) * 0.1;
      score -= repeatPenalty;
      const blockedBy = t.prereq.filter(p => !masteryCriteria(rec(p)).ok && mastery(rec(p)) < gate);
      const masteredNoReview = crit.ok && !overdue && due === 0;
      rows.push({
        topicId: t.id, name: t.name, group: t.group, mastery: m, criteria: crit, status: status(r), attempts: r.attempts,
        factors: { importance, learningGap, prerequisiteRelevance, reviewUrgency },
        weighted: { importance: importance * W.importance, learningGap: learningGap * W.gap, prerequisiteRelevance: prerequisiteRelevance * W.prereq, reviewUrgency: reviewUrgency * W.urgency },
        repeatPenalty, consecutive, score, blockedBy, masteredNoReview, due, errStreak, overdue, record: r,
      });
    }
    return rows;
  }

  function chooseActivity(row, ctx) {
    const r = row.record;
    const prereqsStrong = topicById(row.topicId).prereq.every(p => mastery(ctx.topics[p] || newTopicRecord(p)) >= 0.75);
    if (row.status === 'mastered') return { type: 'review', difficulty: 'avancado', reason: 'tópico já atingiu o critério de domínio provisório; resta revisão espaçada' };
    if (r.attempts === 0 || (r.diagnostic && r.attempts <= 1)) {
      if (r.diagnostic === 'independent' && prereqsStrong) return { type: 'practice', difficulty: 'intermediario', reason: 'você acertou este tópico no diagnóstico e domina os pré-requisitos, então a aula básica é dispensável' };
      return { type: 'learn', difficulty: 'basico', reason: 'ainda não há evidência de domínio; começar pela explicação' };
    }
    if (row.errStreak >= 2) return { type: 'learn', difficulty: 'basico', reason: `${row.errStreak} erros seguidos indicam que vale reaprender o conceito antes de praticar mais` };
    if (row.mastery < 0.5) return { type: 'practice', difficulty: 'basico', reason: 'domínio estimado abaixo de 50%: prática básica com dicas' };
    if (row.mastery < 0.75) return { type: 'practice', difficulty: 'intermediario', reason: 'domínio estimado entre 50% e 75%: prática intermediária' };
    return { type: 'practice', difficulty: 'avancado', reason: 'domínio estimado acima de 75%: falta comprovar com questões avançadas e variadas' };
  }

  /**
   * Recomendação principal com fatores. Retorna objeto usado diretamente pelo botão
   * "Por que esta recomendação?".
   */
  function recommend(ctx) {
    const settings = ctx.settings || {};
    const reserveExam = settings.reserveExamMinutes ?? CONFIG.defaults.reserveExamMinutes;
    const reserveFinal = settings.reserveFinalMinutes ?? CONFIG.defaults.reserveFinalMinutes;
    const rows = scoreAll(ctx);
    const notes = [];
    if (ctx.mode === 'emergency' && typeof ctx.remainingMinutes === 'number') {
      if (!ctx.examDone && ctx.remainingMinutes <= reserveExam + reserveFinal) {
        return { kind: 'exam', type: 'exam', reserve: true, rows, remainingMinutes: ctx.remainingMinutes, notes: [`Restam ${Math.round(ctx.remainingMinutes)} min, que é ≤ ${reserveExam + reserveFinal} min reservados para simulado + revisão final. O simulado tem precedência para medir o que você resolve sozinho.`] };
      }
      if (ctx.examDone && ctx.remainingMinutes <= reserveFinal) {
        return { kind: 'final', type: 'final', reserve: true, rows, remainingMinutes: ctx.remainingMinutes, notes: [`Restam ${Math.round(ctx.remainingMinutes)} min (≤ ${reserveFinal} min reservados): hora da revisão final pelos seus pontos fracos.`] };
      }
    }
    let pool = rows.filter(r => r.blockedBy.length === 0 && !r.masteredNoReview);
    const blocked = rows.filter(r => r.blockedBy.length > 0);
    if (ctx.mode === 'emergency' && ctx.block && ctx.block.topics && ctx.block.topics.length) {
      const inBlock = pool.filter(r => ctx.block.topics.includes(r.topicId));
      if (inBlock.length) { pool = inBlock; notes.push(`No modo Revisão de Emergência, a escolha fica restrita aos tópicos do bloco atual ("${ctx.block.title}") enquanto houver algum disponível.`); }
      else {
        // tópicos do bloco bloqueados → recomendar o pré-requisito
        const bl = rows.filter(r => ctx.block.topics.includes(r.topicId) && r.blockedBy.length);
        if (bl.length) {
          const pre = new Set(bl.flatMap(r => r.blockedBy));
          const prePool = rows.filter(r => pre.has(r.topicId) && r.blockedBy.length === 0);
          if (prePool.length) { pool = prePool; notes.push(`Os tópicos do bloco atual dependem de ${[...pre].map(p => topicById(p).name).join(', ')}, que ainda não atingiu o domínio mínimo; por isso ele vem antes.`); }
        } else notes.push('Os tópicos do bloco atual já atingiram o critério de domínio; a escolha passou para todos os tópicos.');
      }
    }
    if (!pool.length) return { kind: 'exam', type: ctx.examDone ? 'final' : 'exam', rows, notes: ['Todos os tópicos atingiram o critério de domínio provisório. Faça um simulado para confirmar.'] };
    pool.sort((a, b) => b.score - a.score || a.topicId.localeCompare(b.topicId));
    const best = pool[0];
    const activity = chooseActivity(best, ctx);
    const unlockedBy = blocked.filter(r => r.blockedBy.includes(best.topicId)).map(r => r.topicId);
    return { kind: 'topic', topicId: best.topicId, ...activity, row: best, runnerUp: pool[1] || null, unlockedBy, rows, notes, remainingMinutes: ctx.remainingMinutes };
  }

  const pct = x => `${Math.round(x * 100)}%`;
  /** Texto natural derivado exclusivamente do objeto de recomendação. */
  function explain(rec) {
    const lines = [];
    if (rec.kind !== 'topic') { lines.push(...rec.notes); return { title: rec.type === 'exam' ? 'Simulado recomendado' : 'Revisão final recomendada', lines, factors: null }; }
    const r = rec.row, t = topicById(rec.topicId);
    lines.push(`Recomendamos "${t.name}" (${rec.type === 'learn' ? 'aprender' : rec.type === 'review' ? 'revisar' : 'praticar, nível ' + rec.difficulty}) porque ${rec.reason}.`);
    lines.push(`Domínio estimado: ${pct(r.mastery)} com ${r.attempts} tentativa(s) registrada(s)${r.attempts < 5 ? ' — poucos dados, estimativa incerta' : ''}. Critério: ${r.criteria.detail}.`);
    if (r.errStreak) lines.push(`Há ${r.errStreak} erro(s) seguido(s) recentes neste tópico.`);
    if (rec.unlockedBy.length) lines.push(`Ele é pré-requisito de ${rec.unlockedBy.map(id => topicById(id).name).join(', ')}, que só serão recomendados quando este atingir o domínio mínimo.`);
    if (r.due) lines.push(`${r.due} flashcard(s) deste tópico estão com revisão vencida.`);
    lines.push(...rec.notes);
    if (typeof rec.remainingMinutes === 'number') lines.push(`Tempo restante considerado: ${Math.round(rec.remainingMinutes)} min.`);
    if (rec.runnerUp) lines.push(`Segunda opção: "${topicById(rec.runnerUp.topicId).name}" (pontuação ${rec.runnerUp.score.toFixed(3)} contra ${r.score.toFixed(3)}).`);
    lines.push('O que muda a recomendação: acertos independentes elevam o domínio; erros e dicas mantêm o tópico em foco; ao atingir o critério, ele sai da fila (exceto revisões vencidas).');
    return { title: `Por que "${t.name}"?`, lines, factors: r.factors, weighted: r.weighted, score: r.score, penalty: r.repeatPenalty };
  }

  /**
   * Replaneja o tempo restante preservando cobertura e reservas.
   * Retorna [{kind, topics?, group?, minutes, title}]
   */
  function planRemaining(ctx, minutes) {
    const short = minutes < 180;
    const exam = ctx.examDone ? 0 : (short ? 25 : CONFIG.defaults.reserveExamMinutes);
    const final = short ? 20 : CONFIG.defaults.reserveFinalMinutes;
    const breaks = Math.max(0, Math.floor(minutes / 60)) * (short ? 5 : 10);
    let study = Math.max(0, minutes - exam - final - breaks);
    const rows = scoreAll(ctx);
    const groups = CONFIG.groups.map(g => {
      const gr = rows.filter(r => r.group === g.id);
      const open = gr.filter(r => !r.masteredNoReview);
      return { g, score: Math.max(...gr.map(r => r.score)), open, focus: (open.length ? open : gr).sort((a, b) => b.score - a.score).slice(0, 2).map(r => r.topicId) };
    }).sort((a, b) => b.score - a.score);
    const minEach = Math.min(10, Math.floor(study / groups.length));
    const plan = [];
    let left = study - minEach * groups.length;
    const totalScore = groups.reduce((s, x) => s + x.score, 0) || 1;
    groups.forEach(x => {
      const extra = Math.floor(left * x.score / totalScore);
      plan.push({ kind: 'study', group: x.g.id, topics: x.focus, minutes: minEach + extra, title: `${x.g.name}${x.open.length ? '' : ' (revisão rápida)'}` });
    });
    const assigned = plan.reduce((s, p) => s + p.minutes, 0);
    if (plan.length) plan[0].minutes += study - assigned;
    if (exam) plan.push({ kind: 'exam', minutes: exam, title: short ? 'Simulado de emergência' : 'Simulado misto' });
    plan.push({ kind: 'final', minutes: final, title: 'Revisão final dos pontos fracos' });
    if (breaks) plan.push({ kind: 'break', minutes: breaks, title: 'Pausas' });
    return plan;
  }

  return { newTopicRecord, recordAttempt, mastery, masteryCriteria, status, descendants, scoreAll, recommend, explain, planRemaining, chooseActivity };
})();

/* ==========================================================================
   Questões: modelo, normalização/correção de campos, geradores (puros)
   Modelo de questão:
   { id, sig, topic, difficulty, kind, source:'prof'|'var'|'comp'|'gen', ref,
     prompt (HTML), fields:[{key,label,type,options?,placeholder?}], answer:{key:valor},
     hints:[3], fb:{asked, concept, rule, steps[], why, pitfalls[]}, tags:{campo|'*': tag}, fullVlsm? }
   ========================================================================== */
const Check = (() => {
  const norm = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
  const types = {
    ip: (v, a) => IPv4.toInt(String(v)) !== null && IPv4.toInt(String(v)) === IPv4.toInt(String(a)),
    prefix: (v, a) => { const p = IPv4.parsePrefix(String(v)); return p !== null && p === IPv4.parsePrefix(String(a)); },
    number: (v, a) => { const t = String(v).replace(/[.\s]/g, '').replace(',', '.'); return t !== '' && Number(t) === Number(a); },
    cidr: (v, a) => { const x = IPv4.parseCidr(String(v)), y = IPv4.parseCidr(String(a)); return !!x && !!y && x.ip === y.ip && x.prefix === y.prefix; },
    ipv6short: (v, a) => { const c = IPv6.compress(String(v)); return IPv6.equal(v, a) && c !== null && String(v).trim().length === IPv6.compress(a).length && !/(^|:)0[0-9a-f]/i.test(String(v)); },
    ipv6full: (v, a) => norm(v) === norm(IPv6.expand(a)),
    choice: (v, a) => v !== '' && v !== null && v !== undefined && Number(v) === Number(a),
    text: (v, a) => (Array.isArray(a) ? a : [a]).some(x => norm(x) === norm(v)),
  };
  /** Valida um campo; retorna true/false. */
  const field = (f, value, answer) => (types[f.type] || types.text)(value, answer);
  /** Corrige questão inteira: {ok, perField:{key:bool}, wrongKeys:[]} */
  function question(q, values) {
    const perField = {};
    for (const f of q.fields) perField[f.key] = field(f, values[f.key] ?? '', q.answer[f.key]);
    const wrongKeys = Object.keys(perField).filter(k => !perField[k]);
    return { ok: wrongKeys.length === 0, perField, wrongKeys };
  }
  /** Texto legível da resposta correta de um campo. */
  function display(f, a) {
    if (f.type === 'choice') return f.options[a];
    if (f.type === 'prefix') { const p = IPv4.parsePrefix(String(a)); return `/${p} (${IPv4.maskStr(p)})`; }
    if (f.type === 'ipv6short') return IPv6.compress(a);
    if (f.type === 'ipv6full') return IPv6.expand(a);
    return String(a);
  }
  return { field, question, display, types };
})();

/** RNG determinístico (mulberry32) para geradores reprodutíveis */
function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return { next, int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)), pick: arr => arr[Math.floor(next() * arr.length)], shuffle: arr => { const b = [...arr]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; } };
}

const Gen = (() => {
  const { toStr, maskStr, info, minPrefixForHosts, usableHosts, blockSize } = IPv4;
  const code = s => `<code>${s}</code>`;
  const DIFF = ['basico', 'intermediario', 'avancado'];

  function randomIp(rng, p, difficulty) {

        tags: { net: 'salto', bc: 'rede-vs-broadcast', first: 'rede-vs-broadcast', last: 'rede-vs-broadcast', hosts: 'contagem-hosts' },

        fb: { asked: `Menor prefixo para ${n} hosts`, concept: 'Cada bit de host dobra o tamanho do bloco', rule: '2^h − 2 ≥ hosts → prefixo = 32 − h', steps: [`2^${h - 1} − 2 = ${2 ** (h - 1) - 2} ${2 ** (h - 1) - 2 >= n ? '≥' : '<'} ${n} → ${2 ** (h - 1) - 2 >= n ? 'basta' : 'não basta'}.`, `2^${h} − 2 = ${2 ** h - 2} ≥ ${n} → basta.`, `Prefixo = 32 − ${h} = /${p} → máscara ${maskStr(p)}.`], why: `Com ${h - 1} bits não cabem ${n} hosts; com ${h} bits cabem ${2 ** h - 2}. Um prefixo maior que /${p} seria pequeno demais; menor desperdiçaria endereços.`, pitfalls: ['Escolher o prefixo "mais próximo" sem verificar se cabe (ex.: /27 para 60 hosts → só 30).', 'Esquecer o −2 (rede e broadcast): 64 endereços não são 64 hosts.'] },

        fb: { asked: `Prefixo, rede e broadcast da ${nth}ª sub-rede`, concept: 'Subdivisão por bits emprestados', rule: 'sub-redes = 2^bits emprestados; tamanho = 2^(32 − novo prefixo)', steps: [`${parts} sub-redes → 2^${k} → ${k} bits emprestados → /${np} (${maskStr(np)}).`, `Tamanho de cada bloco: 2^${32 - np} = ${blockSize(np)} endereços.`, `${nth}ª sub-rede: ${toStr(base)} + ${nth - 1} × ${blockSize(np)} = ${toStr(i.network)}.`, `Broadcast: próximo bloco − 1 = ${toStr(i.broadcast)}.`], why: 'Os blocos são consecutivos e do mesmo tamanho, então a posição n basta para localizar a sub-rede.', pitfalls: ['Contar a primeira sub-rede como "0ª" quando o enunciado diz "primeira = 1ª".', 'Somar o tamanho do bloco no octeto errado em prefixos menores que /24.'] },

        hints: ['A classe é definida apenas pelo primeiro octeto.', 'A: 1–126 · B: 128–191 · C: 192–223 · D: 224–239 · E: 240–255.', '127 é reservado para loopback.'],
        fb: { asked: 'Classe do endereço', concept: 'Endereçamento classful (histórico)', rule: 'A 1–126, B 128–191, C 192–223, D 224–239, E 240–255; 127/8 loopback', steps: [`Primeiro octeto: ${o}.`, `Faixa → ${opts[idx]}${c.note ? ' — ' + c.note : ''}.`], why: 'Antes do CIDR, os bits iniciais do primeiro octeto definiam a classe e a máscara padrão.', pitfalls: ['Classificar 186.x como classe C (é B: 128–191).', 'Incluir 127 na classe A como endereço utilizável.'] },
        tags: { c: 'classes' },
      };
    },
    /** VLSM completo */
    vlsm(rng, d) {
      const bp = d === 'avancado' ? rng.pick([23, 24]) : 24;
      const base = IPv4.network(192 * 2 ** 24 + 168 * 65536 + rng.int(0, 254) * 256, bp);
      const n = d === 'basico' ? 3 : d === 'intermediario' ? 4 : 5;
      const space = blockSize(bp);
      let demands, r;
      for (let tries = 0; tries < 50; tries++) {
        demands = Array.from({ length: n }, (_, j) => ({ name: String.fromCharCode(65 + j), hosts: rng.int(2, Math.floor(space / (j + 2.5))) }));
        r = VLSM.allocate(base, bp, demands);
        if (r.ok) break;
      }
      while (!r.ok) { demands = demands.map(x => ({ ...x, hosts: Math.max(2, Math.floor(x.hosts / 2)) })); r = VLSM.allocate(base, bp, demands); }
      const sorted = [...r.allocations];

    base('prof-q7', 'cidr', 'basico', 'Em um link que precisa de apenas <strong>2 hosts</strong> utilizáveis, qual é a máscara com menor desperdício (cálculo convencional)? Responda em CIDR ou decimal.', [F('p', 'Máscara', 'prefix')], { p: '/30' },
      { source: 'prof', ref: 'Lista Q7', kind: 'minMask', concept: 'Enlaces ponto a ponto', rule: '2^2 − 2 = 2 → /30', steps: ['h = 2 → 4 endereços → 2 hosts.', '/30 = 255.255.255.252.'], why: 'É a resposta convencional da lista. Complemento: a RFC 3021 permite /31 em enlaces ponto a ponto (2 endereços, sem rede/broadcast), mas não é o padrão cobrado aqui.', pitfalls: ['Responder /31 sem o contexto da RFC 3021.'], hints: ['Quantos endereços para 2 hosts + rede + broadcast?', '4 = 2^2.', '32 − 2.'], tags: { p: 'escolha-mascara' } }),
    base('prof-q8', 'mascara', 'intermediario', `Dado o IP ${c('172.16.150.1/22')}, qual é o endereço de rede e a máscara decimal?`, [F('n', 'Rede', 'ip'), F('m', 'Máscara decimal', 'ip')], { n: '172.16.148.0', m: '255.255.252.0' },
      { source: 'prof', ref: 'Lista Q8', kind: 'whichSubnet', concept: 'Salto no 3º octeto', rule: '/22 → 255.255.252.0, salto 4 no 3º octeto', steps: ['/22 = 8 + 8 + 6 → 3º octeto = 252.', 'Salto = 256 − 252 = 4.', 'Múltiplo de 4 ≤ 150 → 148.', 'Rede 172.16.148.0 (broadcast 172.16.151.255).'], why: 'Com prefixo entre /17 e /24, o octeto que varia é o terceiro.', pitfalls: ['Aplicar o salto no 4º octeto.'], hints: ['Em qual octeto a máscara deixa de ser 255?', '256 − 252.', 'Múltiplos de 4: …144, 148, 152…'], tags: { n: 'salto', m: 'escolha-mascara' } }),
    base('prof-q9', 'mascara', 'intermediario', `O endereço de broadcast é ${c('20.4.135.255')} e a máscara é ${c('/23')}. Qual é o endereço de rede?`, [F('n', 'Rede', 'ip')], { n: '20.4.134.0' },

    base('prof-q10', 'mascara', 'basico', `Qual o número de hosts utilizáveis em uma sub-rede com máscara ${c('255.255.252.0')}?`, [F('h', 'Hosts', 'number')], { h: 1022 },
      { source: 'prof', ref: 'Lista Q10', kind: 'hosts', concept: 'Contagem de hosts', rule: '2^h − 2', steps: ['252 = 11111100 → /22.', '10 bits de host → 1024 − 2 = 1022.'], why: 'Rede e broadcast são reservados.', pitfalls: ['Responder 1024.', 'Contar apenas os bits do último octeto.'], hints: ['Converta para /n.', '/22 → quantos bits de host?', '2^10 = 1024.'], tags: { h: 'contagem-hosts' } }),
    base('prof-q11', 'vlsm', 'intermediario', `Você recebeu ${c('192.168.50.0/24')}. Com VLSM, informe prefixo e endereço de rede para: <strong>A = 50 hosts</strong>, <strong>B = 20 hosts</strong>, <strong>C = 10 hosts</strong>.`,
      [F('Ap', 'A — prefixo', 'prefix'), F('An', 'A — rede', 'ip'), F('Bp', 'B — prefixo', 'prefix'), F('Bn', 'B — rede', 'ip'), F('Cp', 'C — prefixo', 'prefix'), F('Cn', 'C — rede', 'ip')],
      { Ap: '/26', An: '192.168.50.0', Bp: '/27', Bn: '192.168.50.64', Cp: '/28', Cn: '192.168.50.96' },
      { source: 'prof', ref: 'Lista Q11', kind: 'vlsm', fullVlsm: true, concept: 'VLSM', rule: 'Maior primeiro; menor bloco que cabe; fronteira válida', steps: ['A: 50 → 2^6 − 2 = 62 → /26 em .0 (hosts .1–.62, bc .63).', 'B: 20 → 2^5 − 2 = 30 → /27 em .64 (hosts .65–.94, bc .95).', 'C: 10 → 2^4 − 2 = 14 → /28 em .96 (hosts .97–.110, bc .111).'], why: 'Cada bloco começa logo após o anterior, já alinhado ao seu tamanho.', pitfalls: ['Dar /27 para A (30 < 50).'], hints: ['Ordem: A, B, C.', 'A precisa de 64 endereços.', 'B começa em .64; C começa em .96.'], tags: { Ap: 'escolha-mascara', An: 'alinhamento', Bp: 'escolha-mascara', Bn: 'alinhamento', Cp: 'escolha-mascara', Cn: 'alinhamento' } }),
    base('prof-q12', 'vlsm', 'intermediario', `Continuando o exercício anterior (A=.0/26, B=.64/27, C=.96/28 em ${c('192.168.50.0/24')}), a partir do próximo endereço livre após C, aloque <strong>D = 5 hosts</strong>, <strong>E = 2 hosts</strong>, <strong>F = 2 hosts</strong>.`,
      [F('Dp', 'D — prefixo', 'prefix'), F('Dn', 'D — rede', 'ip'), F('Ep', 'E — prefixo', 'prefix'), F('En', 'E — rede', 'ip'), F('Fp', 'F — prefixo', 'prefix'), F('Fn', 'F — rede', 'ip')],
      { Dp: '/29', Dn: '192.168.50.112', Ep: '/30', En: '192.168.50.120', Fp: '/30', Fn: '192.168.50.124' },
      { source: 'prof', ref: 'Lista Q12', kind: 'vlsm', fullVlsm: true, concept: 'VLSM (continuação)', rule: 'Próximo livre após C = .112', steps: ['C termina em .111 → próximo .112.', 'D: 5 → 2^3 − 2 = 6 → /29 em .112 (bc .119).', 'E: 2 → /30 em .120 (bc .123).', 'F: 2 → /30 em .124 (bc .127).'], why: '"2 hosts no total" = 2 utilizáveis → /30 no cálculo convencional.', pitfalls: ['Dar /30 para D (só 2 hosts).'], hints: ['Onde termina C?', 'D precisa de 8 endereços.', 'E e F precisam de 4 cada.'], tags: { Dp: 'escolha-mascara', Dn: 'alinhamento', Ep: 'escolha-mascara', En: 'alinhamento', Fp: 'escolha-mascara', Fn: 'alinhamento' } }),
    base('prof-q13', 'vlsm', 'intermediario', 'No exercício 11 (A=50 em /26, B=20 em /27, C=10 em /28), qual o total de endereços de host utilizáveis que ficaram <strong>sem uso</strong> em A, B e C?', [F('n', 'Total sem uso', 'number')], { n: 26 },
      { source: 'prof', ref: 'Lista Q13', kind: 'waste', concept: 'Desperdício no VLSM', rule: 'sobra = hosts utilizáveis do bloco − demanda', steps: ['A: 62 − 50 = 12.', 'B: 30 − 20 = 10.', 'C: 14 − 10 = 4.', 'Total = 26.'], why: 'O enunciado pede os endereços "disponíveis para a máscara" que não foram usados — conta-se sobre os hosts utilizáveis.', pitfalls: ['Somar rede e broadcast (daria 32).'], hints: ['Calcule a sobra de cada sub-rede.', 'Use 62, 30 e 14.', '12 + 10 + 4.'], tags: { n: 'contagem-hosts' } }),
    base('prof-q14', 'vlsm', 'basico', 'Para a Sub-rede A (192.168.50.0/26), se o gateway padrão for o <strong>último endereço utilizável</strong>, qual será o IP?', [F('g', 'Gateway', 'ip')], { g: '192.168.50.62' },

    mc('prof-q19', 'vlsm', 'avancado', `Um analista usou ${c('192.168.1.0/27')} para os switches e depois ${c('192.168.1.32/26')} para os servidores. Qual é o problema?`,

      { source: 'prof', ref: 'Lista Q19', kind: 'alignment', concept: 'Alinhamento e sobreposição', rule: 'Blocos /26 começam em múltiplos de 64', steps: ['/26 → blocos .0, .64, .128, .192.', '.32 não é múltiplo de 64 → pertence a .0/26 (.0–.63).', '.0/26 contém .0/27 → sobreposição.', 'Correção: usar a próxima /26 livre, 192.168.1.64/26.'], why: 'Um bloco CIDR só pode começar em múltiplo do seu tamanho.', pitfalls: ['Achar que blocos podem começar em qualquer endereço livre.'], hints: ['Quais são os inícios válidos de /26?', '.32 é múltiplo de 64?', 'Qual bloco /26 contém .32?'], tag: 'alinhamento' }),
    base('prof-q20', 'sumarizacao', 'intermediario', `Uma empresa tem a filial ${c('192.168.32.0/24')} e comprou outra que usa ${c('192.168.33.0/24')}. Juntando as duas em uma única rede, qual o endereço de rede, a máscara e quantos hosts podem ser endereçados?`,

    mc('v-ipv4-2', 'ipv4', 'basico', `O endereço ${c('127.0.0.1')} é:`, ['Um host classe A comum', 'Loopback — a própria máquina', 'Broadcast limitado', 'Endereço privado classe B'], 1,

/* ==========================================================================
   Terminal educacional Cisco IOS — SUBCONJUNTO de comandos (não é um emulador completo)
   Modelo: lab = { devices:{id:Device}, links:[{a,pa,b,pb}], hosts:{id:Host} }
   Switch: {type:'switch', l3?:bool, hostname, vlans:{id:{name}}, ports:{name:Port}, svis:{vlan:{ip,mask,shutdown}}, ipRouting, stp:{mode, priority:{vlan:n}}, mac, saved, secret, noDomainLookup}
   Port: {mode:'dynamic auto'|'access'|'trunk'|'dynamic desirable', access:1, allowed:'all'|[ids], native:1, shutdown:false, nonegotiate, portfast, bpduguard, cost, encapDot1q, desc}
   Router: {type:'router', hostname, ifaces:{name:{ip,mask,shutdown,encap,desc}}, dhcp:{pools:{name:{network,mask,router,dns}}, excluded:[[a,b]]}, routes:[{net,mask,nh}]}
   Host: {id, sw, port, ip, mask, gw, dhcp:bool, mac}
   ========================================================================== */
const IOS = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));
  const I = IPv4.toInt;

  /* ---------- nomes de interface ---------- */
  function normIface(raw) {
    const s = String(raw).trim().replace(/\s+/g, '');
    const m = s.match(/^([a-z]+)(\d+\/\d+(?:\/\d+)?)(?:\.(\d+))?$/i);
    if (!m) return null;
    const t = m[1].toLowerCase();
    let pre = null;
    if ('fastethernet'.startsWith(t) || t === 'fa' || t === 'f') pre = 'Fa';
    else if ('gigabitethernet'.startsWith(t) || t === 'gi' || t === 'g') pre = 'Gi';
    if (!pre) return null;
    return `${pre}${m[2]}${m[3] ? '.' + m[3] : ''}`;
  }
  const longName = n => n.replace(/^Fa/, 'FastEthernet').replace(/^Gi/, 'GigabitEthernet');
  /** "1,10,20-22" → [1,10,20,21,22] */
  function parseVlanList(s) {
    const out = [];
    for (const part of String(s).split(',')) {
      const m = part.trim().match(/^(\d+)(?:-(\d+))?$/);
      if (!m) return null;
      const a = +m[1], b = m[2] ? +m[2] : a;
      if (a < 1 || b > 4094 || b < a) return null;
      for (let v = a; v <= b; v++) out.push(v);
    }
    return out;
  }
  const vlanListStr = arr => { if (arr === 'all') return '1-4094'; const a = [...arr].sort((x, y) => x - y); const out = []; for (let i = 0; i < a.length;) { let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}-${a[j]}` : `${a[i]}`); i = j + 1; } return out.join(','); };

  /* ---------- fábricas ---------- */
  function makeSwitch(hostname, portSpec, opts = {}) {
    const ports = {};
    for (const p of portSpec) ports[p] = { mode: 'dynamic auto', access: 1, allowed: 'all', native: 1, shutdown: false };
    return { type: 'switch', l3: !!opts.l3, hostname, vlans: { 1: { name: 'default' } }, ports, svis: { 1: { ip: null, mask: null, shutdown: true } }, ipRouting: false, stp: { mode: 'pvst', priority: {} }, mac: opts.mac || '0001.4200.0001', saved: false };
  }
  function makeRouter(hostname, ifaces) {
    const f = {}; for (const i of ifaces) f[i] = { ip: null, mask: null, shutdown: true };
    return { type: 'router', hostname, ifaces: f, dhcp: { pools: {}, excluded: [] }, routes: [], saved: false };
  }
  const faRange = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => `Fa0/${a + i}`);

  /* ---------- sessão ---------- */
  const newSession = device => ({ device, mode: 'user', ctx: null, history: [] });
  function prompt(lab, s) {
    const d = lab.devices[s.device]; const h = d.hostname;
    return { user: `${h}>`, priv: `${h}#`, config: `${h}(config)#`, if: `${h}(config-if)#`, range: `${h}(config-if-range)#`, subif: `${h}(config-subif)#`, vlan: `${h}(config-vlan)#`, dhcp: `${h}(dhcp-config)#` }[s.mode];
  }

  /* ---------- abreviações ---------- */
  const k = (tok, word, min = 1) => !!tok && tok.length >= min && word.startsWith(tok.toLowerCase());
  const ERR_INVALID = "% Invalid input detected at '^' marker.";
  const ERR_INCOMPLETE = '% Incomplete command.';

  /* ---------- helpers de estado ---------- */
  function vlanExists(sw, v) { return !!sw.vlans[v]; }
  function portVlans(p) { return p.mode === 'trunk' ? (p.allowed === 'all' ? 'all' : p.allowed) : null; }

  /* ======================= EXECUÇÃO ======================= */
  /** Executa uma linha. Retorna {lab, session, out:[...linhas], ok:boolean} sem mutar os argumentos. */
  function exec(labIn, sessIn, line) {
    const lab = clone(labIn), s = clone(sessIn);
    const out = [];
    const raw = String(line).trim();
    s.history = [...(s.history || []), raw].slice(-50);
    if (!raw || raw.startsWith('!')) return { lab, session: s, out, ok: true };
    let t = raw.split(/\s+/);
    const dev = lab.devices[s.device];
    const fail = msg => { out.push(msg); return { lab, session: s, out, ok: false }; };
    const done = () => ({ lab, session: s, out, ok: true });

    // "do" em modos de configuração
    if (s.mode !== 'user' && s.mode !== 'priv' && k(t[0], 'do', 2)) {
      const r = k(t[1], 'show', 2) ? execShow(lab, s.device, t.slice(2)) : null;
      if (r) { out.push(...r); return done(); }
      if (k(t[1], 'write', 2) || k(t[1], 'wr', 2) || (k(t[1], 'copy', 2))) { dev.saved = true; out.push('Building configuration...', '[OK]'); return done(); }
      return fail(ERR_INVALID);
    }
    // end / exit universais
    if (k(t[0], 'end', 3) && !['user', 'priv'].includes(s.mode)) { s.mode = 'priv'; s.ctx = null; return done(); }
    if (k(t[0], 'exit', 3)) {
      if (s.mode === 'user') { out.push('(sessão encerrada — pressione Enter para reabrir)'); return done(); }
      if (s.mode === 'priv') { s.mode = 'user'; return done(); }
      if (s.mode === 'config') { s.mode = 'priv'; return done(); }
      s.mode = 'config'; s.ctx = null; return done();
    }
    if (raw === '?' || t[t.length - 1] === '?') { out.push(...help(s.mode, dev.type)); return done(); }

    switch (s.mode) {
      case 'user':
        if (k(t[0], 'enable', 2)) { s.mode = 'priv'; return done(); }
        if (k(t[0], 'show', 2)) { const r = execShow(lab, s.device, t.slice(1)); return r ? (out.push(...r), done()) : fail(ERR_INVALID); }
        if (k(t[0], 'ping', 2)) return (out.push(...pingFromDevice(lab, s.device, t[1])), done());
        return fail(`${ERR_INVALID}\nDica: no modo usuário (">") use "enable" para ir ao modo privilegiado.`);
      case 'priv':
        if (k(t[0], 'configure', 4) && (t.length === 1 || k(t[1], 'terminal', 1))) { s.mode = 'config'; out.push('Enter configuration commands, one per line.  End with CNTL/Z.'); return done(); }
        if (k(t[0], 'show', 2)) { const r = execShow(lab, s.device, t.slice(1)); return r ? (out.push(...r), done()) : fail(ERR_INVALID); }
        if (k(t[0], 'copy', 2) && t[1] && k(t[1], 'running-config', 3) && t[2] && k(t[2], 'startup-config', 3)) { dev.saved = true; out.push('Destination filename [startup-config]?', 'Building configuration...', '[OK]'); return done(); }
        if (k(t[0], 'write', 2) || raw.toLowerCase() === 'wr') { dev.saved = true; out.push('Building configuration...', '[OK]'); return done(); }
        if (k(t[0], 'disable', 4)) { s.mode = 'user'; return done(); }
        if (k(t[0], 'ping', 2)) return (out.push(...pingFromDevice(lab, s.device, t[1])), done());
        if (k(t[0], 'delete', 3) && /vlan\.dat$/i.test(t[1] || '')) {
          if (dev.type !== 'switch') return fail('%Error: arquivo inexistente');
          dev.vlans = { 1: { name: 'default' } }; for (const p of Object.values(dev.ports)) p.access = 1;
          out.push('Delete filename [vlan.dat]?', 'Delete flash:/vlan.dat? [confirm]', '(banco de VLANs apagado; portas voltam à VLAN 1)'); return done();
        }
        if (t[0] === 'conf' || t[0] === 'config') { s.mode = 'config'; return done(); }
        return fail(`${ERR_INVALID}${/^(vlan|interface|int|hostname|ip|switchport)/i.test(t[0]) ? '\nDica: esse comando é do modo de configuração. Use "configure terminal" primeiro.' : ''}`);
      case 'config': return cfgGlobal();
      case 'vlan': return cfgVlan();
      case 'if': case 'range': case 'subif': return cfgIf();
      case 'dhcp': return cfgDhcp();
    }
    return fail(ERR_INVALID);

    /* --- modo (config) --- */
    function cfgGlobal() {
      if (k(t[0], 'hostname', 3)) { if (!t[1]) return fail(ERR_INCOMPLETE); dev.hostname = t[1]; return done(); }
