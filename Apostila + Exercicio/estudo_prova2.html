    const must = { settings: 'object', topics: 'object', history: 'array', schedule: 'object' };
    for (const [k2, ty] of Object.entries(must)) {
      const v = obj[k2];
      if (ty === 'array' ? !Array.isArray(v) : (typeof v !== 'object' || v === null)) errors.push(`Campo "${k2}" ausente ou inválido.`);
    }
    if (errors.length) return { ok: false, errors };
    // mescla com o padrão para preencher campos novos (migração tolerante)
    const base = defaultState(obj.createdAt || Date.now());
    const st = { ...base, ...obj, settings: { ...base.settings, ...obj.settings }, study: { ...base.study, ...(obj.study || {}) }, flash: { ...base.flash, ...(obj.flash || {}) }, lab: { ...base.lab, ...(obj.lab || {}) }, weak: { ...base.weak, ...(obj.weak || {}) }, saibaMais: { ...base.saibaMais, ...(obj.saibaMais || {}) }, ui: { ...base.ui, ...(obj.ui || {}) } };
    for (const t of CONFIG.topics) st.topics[t.id] = { ...Adaptive.newTopicRecord(t.id), ...(obj.topics[t.id] || {}) };
    if (!Array.isArray(st.schedule.blocks) || !st.schedule.blocks.length) st.schedule = base.schedule;
    st.history = st.history.filter(h => h && typeof h === 'object' && h.topic).slice(-MAX_HISTORY);
    st.version = CONFIG.stateVersion;
    return { ok: true, state: st, errors: [] };
  }
  function summary(st) {
    return { createdAt: st.createdAt, updatedAt: st.updatedAt, attempts: st.history.length, exams: (st.exams || []).length, mode: st.settings.mode, blocksDone: st.schedule.blocks.filter(b => b.status === 'done').length };
  }

  /* ---- armazenamento com fallback em memória ---- */
  let memory = null; let storageOk = true;
  function read(storage) {
    try { const raw = storage.getItem(CONFIG.storageKey); if (!raw) return null; return JSON.parse(raw); }
    catch (e) { storageOk = false; return memory; }
  }
  function write(storage, st) {
    st.updatedAt = Date.now();
    const raw = JSON.stringify(st);
    memory = JSON.parse(raw);
    try { storage.setItem(CONFIG.storageKey, raw); storageOk = true; return true; }
    catch (e) { storageOk = false; return false; }
  }
  function backup(storage, st) { try { storage.setItem(CONFIG.storageKey + '-backup', JSON.stringify(st)); return true; } catch (e) { return false; } }
  function readBackup(storage) { try { const r = storage.getItem(CONFIG.storageKey + '-backup'); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

  /* ---- registro de tentativas ---- */
  /** entry: {qid, sig, topic, difficulty, kind, result, hints, attempts, ms, wrongTags, source, fullVlsm, diagnostic} */
  function recordAttempt(st, entry, now = Date.now()) {
    const e = { ...entry, at: now };
    st.history.push(e); if (st.history.length > MAX_HISTORY) st.history.shift();
    if (e.sig && e.result !== 'unknown') st.solved[e.sig] = { result: e.result, at: now };
    st.topics[e.topic] = Adaptive.recordAttempt(st.topics[e.topic] || Adaptive.newTopicRecord(e.topic), { result: e.result, kind: e.kind, sig: e.sig, fullVlsm: e.fullVlsm, now, diagnostic: e.diagnostic });
    return st;
  }
  const solvedSet = (st, prefix = '') => new Set(Object.keys(st.solved).filter(s => s.startsWith(prefix)));
  function resetSolved(st, prefix = '') { for (const s of Object.keys(st.solved)) if (s.startsWith(prefix)) delete st.solved[s]; }

  return { defaultState, validate, summary, read, write, backup, readBackup, recordAttempt, solvedSet, resetSolved, isStorageOk: () => storageOk };
})();

/* ---------------- Cronograma ---------------- */
const Schedule = (() => {
  const initialBlocks = minutes => CONFIG.blocks.map((b, i) => ({ id: `b${i + 1}`, n: i + 1, title: b.title, goal: b.goal, topics: [...b.topics], kind: b.kind, minutes, status: 'todo', doneAt: null }));
  const current = st => st.schedule.blocks.find(b => b.status !== 'done') || null;
  function remainingMinutes(st) {
    const left = st.schedule.blocks.filter(b => b.status !== 'done' && b.kind !== 'break');
    const breaks = Math.max(0, left.length - 1) * st.settings.breakMinutes;
    return left.reduce((s, b) => s + b.minutes, 0) + breaks;
  }
  function totalPlanned(st) { const b = st.schedule.blocks.filter(x => x.kind !== 'break'); return b.reduce((s, x) => s + x.minutes, 0) + Math.max(0, b.length - 1) * st.settings.breakMinutes + 10; }
  /** Replaneja os blocos não concluídos para caber em `minutes`, preservando os concluídos. */
  function replan(st, minutes, ctx) {
    const done = st.schedule.blocks.filter(b => b.status === 'done');
    const plan = Adaptive.planRemaining({ ...ctx, examDone: (st.exams || []).length > 0 }, minutes).filter(p => p.kind !== 'break');
    const blocks = plan.map((p, i) => ({ id: `r${st.schedule.replans + 1}-${i + 1}`, n: done.length + i + 1, title: p.title, goal: p.kind === 'study' ? `Foco: ${p.topics.map(t => CONFIG.topics.find(x => x.id === t).name).join(', ')}` : p.kind === 'exam' ? 'Avaliar o que você resolve sozinho' : 'Revisar pontos fracos e a folha-resumo', topics: p.topics || [], kind: p.kind, minutes: p.minutes, status: 'todo', doneAt: null }));
    st.schedule.blocks = [...done, ...blocks];
    st.schedule.replans++;
    return st;
  }
  function complete(st, id, now = Date.now()) { const b = st.schedule.blocks.find(x => x.id === id); if (b) { b.status = 'done'; b.doneAt = now; } return st; }
  function reopen(st, id) { const b = st.schedule.blocks.find(x => x.id === id); if (b) { b.status = 'todo'; b.doneAt = null; } return st; }
  return { initialBlocks, current, remainingMinutes, totalPlanned, replan, complete, reopen };
})();

/* ---------------- Flashcards (Leitner de curto prazo) ---------------- */
const Flash = (() => {
  // caixas: 0 nova · 1 → 20 min · 2 → 60 min · 3 → 180 min · 4 → revisão final
  const INTERVAL = { 1: 20, 2: 60, 3: 180 };
  const FINAL = 4;
  function rate(card, rating, now = Date.now()) {
    const c = { box: 0, due: 0, seen: 0, lapses: 0, ...card };
    c.seen++; c.last = now; c.lastRating = rating;
    if (rating === 'again') { c.box = 1; c.lapses++; c.due = now + 5 * 60000; }
    else if (rating === 'hard') { c.box = Math.max(1, c.box); c.due = now + Math.round(INTERVAL[Math.min(c.box, 3)] * 0.5) * 60000; }
    else { c.box = Math.min(FINAL, c.box + 1); c.due = c.box >= FINAL ? Infinity : now + INTERVAL[c.box] * 60000; }
    if (c.due === Infinity) c.due = null; // null = aguarda a revisão final
    return c;
  }
  /** Fila: vencidos primeiro (mais atrasados antes), depois novos; filtros por assunto/errados. */
  function queue(cards, stateCards, { topic = 'all', onlyWrong = false, includeFinal = false, now = Date.now(), shuffle = null } = {}) {
    let list = cards.filter(c => topic === 'all' || c.topic === topic);
    if (onlyWrong) list = list.filter(c => (stateCards[c.id] || {}).lapses > 0 || (stateCards[c.id] || {}).lastRating === 'again');
    const due = [], fresh = [], finals = [];
    for (const c of list) {
      const s = stateCards[c.id];
      if (!s || !s.seen) fresh.push(c);
      else if (s.due === null) { if (includeFinal) finals.push(c); }
      else if (s.due <= now) due.push(c);
    }
    due.sort((a, b) => stateCards[a.id].due - stateCards[b.id].due);
    const out = [...due, ...(shuffle ? shuffle(fresh) : fresh), ...finals];
    return out;
  }
  function dueByTopic(cards, stateCards, now = Date.now()) {
    const m = {}; for (const c of cards) { const s = stateCards[c.id]; if (s && s.seen && s.due !== null && s.due <= now) m[c.topic] = (m[c.topic] || 0) + 1; } return m;
  }
  return { rate, queue, dueByTopic, INTERVAL };
})();

/* ---------------- Simulado ---------------- */
const Exam = (() => {
  /** Seleciona questões equilibradas por grupo e dificuldade, preferindo não vistas. */
  function build(bank, { size = 25, seen = new Set(), wrong = new Set(), rng = Math.random } = {}) {
    const groups = CONFIG.groups.map(g => g.id);
    const per = Math.floor(size / groups.length); let extra = size - per * groups.length;
    const out = [];
    const topicGroup = id => CONFIG.topics.find(t => t.id === id).group;
    for (const g of groups) {
      const pool = bank.filter(q => topicGroup(q.topic) === g);
      const score = q => (seen.has(q.id) ? (wrong.has(q.id) ? 1 : 2) : 0) + rng() * 0.9; // não vistas → erradas → acertadas
      const want = per + (extra-- > 0 ? 1 : 0);
      const diffs = ['basico', 'intermediario', 'avancado'];
      const target = { basico: Math.ceil(want * 0.4), intermediario: Math.ceil(want * 0.4), avancado: want };
      const chosen = [];
      for (const d of diffs) {
        const cand = pool.filter(q => q.difficulty === d && !chosen.includes(q)).sort((a, b) => score(a) - score(b));
        for (const q of cand) { if (chosen.length >= want || chosen.filter(x => x.difficulty === d).length >= target[d]) break; chosen.push(q); }
      }
      for (const q of pool.sort((a, b) => score(a) - score(b))) { if (chosen.length >= want) break; if (!chosen.includes(q)) chosen.push(q); }
      // cobrir tópicos distintos dentro do grupo quando possível
      out.push(...chosen);
    }
    return out.map(q => q.id);
  }
  function grade(bank, qids, answers) {
    const byId = Object.fromEntries(bank.map(q => [q.id, q]));
    const res = { total: qids.length, correct: 0, byTopic: {}, byGroup: {}, items: [] };
    for (const id of qids) {
      const q = byId[id]; const a = answers[id] || {};
      const r = Check.question(q, a);
      if (r.ok) res.correct++;
      const g = CONFIG.topics.find(t => t.id === q.topic).group;
      for (const [key, bucket] of [[q.topic, res.byTopic], [g, res.byGroup]]) { bucket[key] = bucket[key] || { total: 0, correct: 0 }; bucket[key].total++; if (r.ok) bucket[key].correct++; }
      res.items.push({ id, ok: r.ok, wrongKeys: r.wrongKeys, answered: Object.values(a).some(v => v !== '' && v !== undefined) });
    }
    return res;
  }
  return { build, grade };
})();

/* ---------------- Pontos fracos ---------------- */
const Weak = (() => {
  /** Agrupa por conceito (tag). status: 'ativo' | 'melhorando' (último registro do conceito foi acerto independente) */
  function analyze(history, marked = {}) {
    const m = {};
    for (const h of history) {
      const tags = h.result === 'incorrect' || h.result === 'assisted' ? (h.wrongTags || []) : (h.tagsAll || []);
      for (const t of new Set(tags)) {
        if (!CONFIG.errorTags[t]) continue;
        const e = (m[t] = m[t] || { tag: t, errors: 0, assisted: 0, correctAfter: 0, last: 0, lastResult: null, examples: [] });
        if (h.result === 'incorrect') e.errors++;
        else if (h.result === 'assisted') e.assisted++;
        else if (h.result === 'independent' && (e.errors || e.assisted)) e.correctAfter++;
        if (h.result !== 'independent' || e.errors || e.assisted) { e.last = Math.max(e.last, h.at); e.lastResult = h.result; }
        if (h.result !== 'independent' && e.examples.length < 3 && !e.examples.includes(h.qid)) e.examples.push(h.qid);
      }
    }
    const list = Object.values(m).filter(e => e.errors + e.assisted > 0 || marked[e.tag]);
    for (const e of list) {
      e.name = CONFIG.errorTags[e.tag].name; e.topic = CONFIG.errorTags[e.tag].topic; e.marked = !!marked[e.tag];
      e.status = e.lastResult === 'independent' ? 'melhorando' : 'ativo';
      e.weight = e.errors * 1 + e.assisted * 0.5 - e.correctAfter * 0.3 + (e.marked ? 0.5 : 0);
    }
    for (const t of Object.keys(marked)) if (marked[t] && !m[t] && CONFIG.errorTags[t]) list.push({ tag: t, name: CONFIG.errorTags[t].name, topic: CONFIG.errorTags[t].topic, errors: 0, assisted: 0, correctAfter: 0, examples: [], marked: true, status: 'marcado', weight: 0.5 });
    return list.sort((a, b) => b.weight - a.weight);
  }
  /** Hipóteses (não afirmações) a partir de padrões dos campos errados. */
  function hypotheses(e) {
    const H = {
      'rede-vs-broadcast': 'Talvez você esteja trocando o início do bloco (rede, bits de host = 0) com o fim (broadcast, bits de host = 1), ou esquecendo que o broadcast é um antes do próximo bloco.',
      'salto': 'Possível causa: aplicar o salto no octeto errado ou calcular 256 − máscara com o octeto errado.',
      'escolha-mascara': 'Possível causa: escolher o prefixo sem testar 2^h − 2 ≥ hosts, ou confundir bits de rede com bits de host.',
      'contagem-hosts': 'Possível causa: esquecer o −2 ou contar só os bits do último octeto.',
      'alinhamento': 'Possível causa: iniciar um bloco em endereço que não é múltiplo do seu tamanho.',
      'ordem-vlsm': 'Possível causa: alocar na ordem do enunciado em vez de maior → menor.',
      'access-vs-trunk': 'Possível causa: não diferenciar porta de PC (uma VLAN, sem tag) de enlace entre switches/roteador (várias VLANs, com tag).',
      'root-bridge': 'Possível causa: comparar MAC antes da prioridade ou escolher o maior valor.',
      'papeis-porta': 'Possível causa: confundir Root Port (rumo à raiz, por switch) com Designated Port (por segmento).',
      'ios-sintaxe': 'Possível causa: comando certo no modo errado (ex.: "vlan 10" fora do modo de configuração).',
    };
    return H[e.tag] || 'Não é possível determinar a causa exata a partir das respostas; revise o conceito e tente um exercício semelhante.';
  }
  return { analyze, hypotheses };
})();

<h4 id="vlsm">VLSM — Variable Length Subnet Mask</h4>
<p>{{prof}} O VLSM permite sub-redes de <strong>tamanhos diferentes</strong> dentro do mesmo bloco, reduzindo o desperdício. Procedimento:</p>
<ol><li>Ordene as demandas da <strong>maior para a menor</strong>.</li><li>Para cada uma, escolha o menor h com 2^h − 2 ≥ hosts.</li><li>Aloque na próxima fronteira múltipla do tamanho do bloco.</li><li>Confira: nenhum bloco pode sobrepor outro.</li></ol>
{{sm:vlsm-ordem}}
<div class="note correction"><strong>Correção das fontes.</strong> No PDF de VLSM: "duas redes com 254 hosts gerariam uma nova maior com 512 IPs disponíveis" — o /23 tem <strong>512 endereços</strong>, mas <strong>510 hosts</strong> utilizáveis. Na <em>Revisão VLSM</em>, a máscara 255.255.255.192 aparece como "= 27": é <strong>/26</strong> (24 + 2 bits). A tabela do /20 pula de 172.16.48.0 para 172.16.80.0; falta <strong>172.16.64.0</strong>. E "192.168127" é um erro de digitação de 192.168.1.127.</div>
<h4 id="sumarizacao">CIDR e sumarização</h4>
<p>{{prof}} Da mesma forma que dividimos, podemos <strong>agrupar</strong> redes contíguas e alinhadas: ${c('192.168.32.0/24')} + ${c('192.168.33.0/24')} = ${c('192.168.32.0/23')}. O prefixo do resumo é a quantidade de bits iniciais comuns.</p>
{{sm:cidr-sumarizacao}}
<p><strong>CIDR × VLSM:</strong> CIDR é a notação/roteamento sem classes (inclui sumarização); VLSM é usar máscaras de tamanhos variados num mesmo plano.</p>`,

      intuition: `<p>Um switch é um <strong>porteiro que decora rostos</strong>: cada vez que alguém sai por uma porta, ele anota "fulano está atrás da porta 3". Quando chega correspondência para alguém desconhecido, ele grita em todas as portas (flooding). O STP é a <strong>placa de "rua sem saída"</strong> que impede que carros fiquem andando em círculos quando há ruas redundantes.</p><p class="limit"><strong>Limite:</strong> o switch não "lembra" para sempre — as entradas expiram (tipicamente 300 s em switches Cisco).</p>`,
      technical: `<h4>Tipos de comutação {{prof}}</h4>

<tr><td>Circuitos</td><td>caminho dedicado estabelecido antes; reservado mesmo ocioso; orientado a conexão</td><td>telefonia tradicional</td></tr>
<tr><td>Mensagens</td><td>mensagem inteira armazenada em cada nó (store-and-forward)</td><td>telex, e-mail</td></tr>
<tr><td>Pacotes</td><td>dados divididos em pacotes; recursos compartilhados; datagrama (IP) ou circuito virtual</td><td>Internet</td></tr>

<p>Na comutação de circuitos, o enlace físico é compartilhado com <strong>FDM</strong> (faixas de frequência) ou <strong>TDM</strong> (fatias de tempo). Na comutação de pacotes: <strong>datagrama</strong> — cada pacote roteado independentemente, sem estado, pode chegar fora de ordem; <strong>circuito virtual</strong> — caminho lógico prévio, pacotes com VCID, ordem garantida (ATM, Frame Relay).</p>
<h4 id="ethernet">Ethernet, MAC e domínios {{prof}}</h4>
<p>Camada 1 (hub/repetidor) repete bits; camada 2 (bridge/switch) encaminha <strong>quadros</strong> por <strong>MAC</strong>; camada 3 (roteador) encaminha <strong>pacotes</strong> por <strong>IP</strong>.</p>
<ul><li><strong>Domínio de colisão:</strong> onde transmissões simultâneas colidem (meio compartilhado). Hub = um só domínio; <strong>cada porta de switch</strong> é um domínio separado (e em full-duplex não há colisão).</li><li><strong>Domínio de broadcast:</strong> até onde vai um quadro para FF:FF:FF:FF:FF:FF. Delimitado por <strong>roteadores</strong> (e por VLANs).</li></ul>
<p><strong>Funcionamento do switch:</strong> (1) aprende o <strong>MAC de origem</strong> associando-o à porta de entrada (e VLAN); (2) consulta o <strong>MAC de destino</strong>: conhecido → encaminha só por aquela porta; desconhecido ou broadcast → <strong>flooding</strong> em todas as portas da VLAN, menos a de entrada.</p>
{{sm:mac-origem}}
{{w:macSim}}
<p><strong>Latência</strong> = atraso da origem ao destino (meio físico, processamento, filas, decisão de comutação).</p>
<h4 id="stp">Spanning Tree Protocol {{prof}}</h4>
<p>Caminhos redundantes entre switches aumentam a disponibilidade, mas criam <strong>loops de camada 2</strong>: tempestade de broadcast, quadros unicast duplicados e instabilidade da tabela MAC. O STP (802.1D) troca <strong>BPDUs</strong> e monta uma árvore lógica sem ciclos, deixando links redundantes como reserva.</p>
{{sm:stp-loops}}
<ol><li><strong>Root Bridge:</strong> menor <strong>Bridge ID</strong> = prioridade (padrão 32768, configurável em múltiplos de 4096) + MAC. Compara-se prioridade; em empate, menor MAC.</li><li><strong>Root Port</strong> (uma por switch não-root): menor custo acumulado até a raiz (custo menor = enlace mais rápido: 100 Mb/s = 19, 1 Gb/s = 4). Empates: menor BID do vizinho, depois menor Port ID.</li><li><strong>Designated Port</strong> (uma por segmento): a ponta com menor custo até a raiz; empate → menor BID. Todas as portas da raiz são designadas.</li><li>As demais portas ficam <strong>bloqueadas</strong>: não encaminham dados, mas continuam ouvindo BPDUs.</li></ol>
{{sm:root-prioridade}}
<table class="tbl"><thead><tr><th>Estado 802.1D</th><th>Faz</th><th>Dados?</th><th>Aprende MAC?</th></tr></thead><tbody><tr><td>Blocking</td><td>escuta BPDUs</td><td>não</td><td>não</td></tr><tr><td>Listening</td><td>prepara-se para RP/DP</td><td>não</td><td>não</td></tr><tr><td>Learning</td><td>monta a tabela MAC</td><td>não</td><td>sim</td></tr><tr><td>Forwarding</td><td>operação normal</td><td>sim</td><td>sim</td></tr><tr><td>Disabled</td><td>shutdown</td><td>não</td><td>não</td></tr></tbody></table>
<p><strong>RSTP (802.1w)</strong> tem apenas 3 estados — <strong>Discarding</strong> (= Blocking + Listening), <strong>Learning</strong>, <strong>Forwarding</strong> — e converge em segundos (proposal/agreement). Papéis novos: <strong>Alternate</strong> e <strong>Backup</strong>. Não confunda <em>papel</em> (Root/Designated/Alternate) com <em>estado</em> (Forwarding/Discarding…).</p>
<table class="tbl"><thead><tr><th>Protocolo</th><th>Norma</th><th>Convergência</th><th>Escopo</th></tr></thead><tbody><tr><td>STP</td><td>802.1D</td><td>30–50 s</td><td>uma árvore</td></tr><tr><td>PVST+</td><td>Cisco</td><td>30–50 s</td><td>por VLAN</td></tr><tr><td>RSTP</td><td>802.1w</td><td>&lt; 2 s</td><td>uma árvore</td></tr><tr><td>Rapid PVST+</td><td>Cisco</td><td>&lt; 2 s</td><td>por VLAN</td></tr><tr><td>MSTP</td><td>802.1s</td><td>&lt; 2 s</td><td>grupos de VLANs</td></tr></tbody></table>
<p><strong>PortFast</strong> leva portas de PCs/servidores direto a Forwarding; <strong>BPDU Guard</strong> desativa a porta se ela receber BPDU.</p>`,

      id: 'vlan', n: 5, title: 'VLANs, trunk e Inter-VLAN', group: 'g-vlan', topics: ['vlan', 'trunk', 'intervlan', 'ios'], minutes: 100,
      sources: ['8-VLAN.pdf', '7-3.4.6_Lab_-_Configure_VLANs_and_Trunking.pdf', '6-Comandos.pdf'],
      objectives: ['Explicar o que uma VLAN isola e por que hosts de VLANs diferentes precisam de roteamento.', 'Diferenciar porta access de trunk e descrever a tag 802.1Q (TPID, PCP, DEI, VID) e a VLAN nativa.', 'Configurar VLANs, portas access, trunk e router-on-a-stick no Cisco IOS.', 'Diagnosticar por que dois hosts não se comunicam (VLAN, trunk, gateway).'],
      intuition: `<p>Uma VLAN é como dividir um prédio em <strong>andares com elevadores privativos</strong>: todos usam a mesma estrutura física, mas quem está no 10º andar não ouve os avisos do 20º. Para ir de um andar a outro é preciso passar pela <strong>portaria</strong> (o roteador).</p><p class="limit"><strong>Limite:</strong> uma VLAN não é segurança completa por si só; configurações erradas (DTP, VLAN nativa) permitem ataques de VLAN hopping.</p>`,
      technical: `<p>{{prof}} <strong>VLAN</strong> = rede lógica dentro de uma LAN física. Cada VLAN é um <strong>domínio de broadcast</strong> distinto e, na prática, uma <strong>sub-rede IP</strong> distinta. Benefícios: isolamento, gerenciamento, desempenho (broadcasts menores), aplicação de regras entre VLANs.</p>
{{sm:vlan-porque}}
<ul><li><strong>Estática:</strong> por porta, configuração manual (padrão: todas as portas na VLAN 1).</li><li><strong>Dinâmica:</strong> por MAC/usuário/dispositivo, com servidor (MAB/802.1X + RADIUS, Cisco ISE, Aruba ClearPass).</li></ul>
<h4 id="trunk">Access, trunk e 802.1Q</h4>
<p><strong>Access:</strong> uma VLAN, liga dispositivos finais; o quadro do PC chega <strong>sem tag</strong>. <strong>Trunk:</strong> várias VLANs no mesmo enlace (switch–switch, switch–roteador), cada quadro identificado por uma <strong>tag</strong>.</p>
{{w:dot1q}}
<p>A tag <strong>IEEE 802.1Q</strong> tem <strong>4 bytes</strong>, inserida entre o <strong>MAC de origem</strong> e o <strong>EtherType</strong>: <strong>TPID</strong> (16 bits, 0x8100) + <strong>TCI</strong> (16 bits) = <strong>PCP</strong> (3 bits, prioridade/QoS) + <strong>DEI</strong> (1 bit, pode ser descartado) + <strong>VID</strong> (12 bits). 2^12 = 4096 valores; 0 e 4095 reservados → <strong>VLANs 1 a 4094</strong>.</p>
{{sm:trunk-tag}}
<p><strong>VLAN nativa:</strong> a VLAN dos quadros que trafegam <strong>sem tag</strong> no trunk (padrão: VLAN 1). Deve ser igual nas duas pontas.</p>
<p><strong>VTP</strong> (Cisco): propaga VLANs num domínio. Modos: <em>servidor</em> (padrão; cria/altera/exclui e propaga; guarda em NVRAM), <em>cliente</em> (só sincroniza), <em>transparente</em> (não participa; repassa anúncios; VLANs locais). Cuidado com o número de revisão: um switch com revisão maior pode sobrescrever (até apagar) as VLANs do domínio.</p>
<p><strong>VLAN hopping:</strong> (1) falsa negociação de trunk via <strong>DTP</strong> — mitigação: fixar access/trunk e ${c('switchport nonegotiate')}; (2) <strong>double tagging</strong> explorando a nativa — mitigação: nativa sem uso (${c('switchport trunk native vlan 999')}); e desligar portas sem uso.</p>
<p><strong>Arquitetura hierárquica:</strong> <em>acesso</em> (usuários, switches L2, IDF), <em>distribuição</em> (switches L3, inter-VLAN, políticas, redundância, QoS), <em>core</em> (backbone de alta velocidade).</p>
<h4 id="intervlan">Roteamento Inter-VLAN</h4>
<p>VLAN 10 e VLAN 20 são sub-redes diferentes → precisam de um equipamento de <strong>camada 3</strong>, que é o gateway de cada VLAN.</p>
{{sm:intervlan-porque}}
<p><strong>A) Router-on-a-stick:</strong> um trunk liga o switch ao roteador; cada VLAN ganha uma <strong>subinterface</strong> com ${c('encapsulation dot1Q N')} e o IP do gateway.</p>
<pre class="cli">Router(config)# interface g0/0
Router(config-if)# no shutdown
Router(config)# interface g0/0.10
Router(config-subif)# encapsulation dot1Q 10

Router(config)# interface g0/0.20
Router(config-subif)# encapsulation dot1Q 20
Router(config-subif)# ip address 192.168.20.1 255.255.255.0</pre>
<p><strong>B) Switch L3:</strong> uma <strong>SVI</strong> por VLAN (${c('interface vlan 10')} + IP + ${c('no shutdown')}) e ${c('ip routing')}. Uma SVI de gerenciamento em switch L2 <em>não</em> roteia.</p>

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}

/* ---------- toast / diálogo ---------- */
function toast(msg, ms = 4200) {
  let w = $('.toast-wrap'); if (!w) { w = h('div', { class: 'toast-wrap', role: 'status', 'aria-live': 'polite' }); document.body.append(w); }
  const t = h('div', { class: 'toast' }, msg); w.append(t); setTimeout(() => t.remove(), ms);
}
function confirmDialog({ title, body, ok = 'Confirmar', cancel = 'Cancelar', danger = false }) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const close = v => { scrim.remove(); document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(false); };
    const okBtn = h('button', { class: `btn ${danger ? 'danger' : 'primary'}`, onclick: () => close(true) }, ok);
    const dlg = h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dlg-t' }, h('h2', { id: 'dlg-t' }, title), typeof body === 'string' ? h('p', {}, body) : body, h('div', { class: 'row', style: { justifyContent: 'flex-end', marginTop: '16px' } }, h('button', { class: 'btn ghost', onclick: () => close(false) }, cancel), okBtn));
    const scrim = h('div', { class: 'dialog-scrim', onclick: e => { if (e.target === scrim) close(false); } }, dlg);
    document.body.append(scrim); document.addEventListener('keydown', onKey); okBtn.focus();
  });
}

/* ---- VLSM: ordem boa × ruim ---- */
Widgets.vlsmCompare = () => {
  const demands = [{ name: 'P2P', hosts: 2 }, { name: 'X', hosts: 100 }, { name: 'Y', hosts: 60 }];
  const base = IPv4.toInt('192.168.1.0');
  function naive() { // aloca na ordem dada, cada um na próxima fronteira
    let cursor = base; const out = [];
    for (const d of demands) { const p = IPv4.minPrefixForHosts(d.hosts), size = 2 ** (32 - p); const a = Math.ceil((cursor - base) / size) * size + base; if (a + size - 1 > base + 255) { out.push({ ...d, fail: true, p }); continue; } out.push({ ...d, net: a, size, p }); cursor = a + size; }
    return out;
  }
  const good = VLSM.allocate(base, 24, demands).allocations.map(a => ({ name: a.name, net: a.net, size: a.size, p: a.prefix }));
  const bar = list => { const b = h('div', { class: 'blocks' }); let cur = base; const items = list.filter(x => !x.fail).sort((a, c) => a.net - c.net); for (const a of items) { if (a.net > cur) b.append(h('div', { style: { flex: String(a.net - cur), background: 'var(--surface-3)' } }, 'livre')); b.append(h('div', { style: { flex: String(a.size), background: VLAN_COLORS[demands.findIndex(d => d.name === a.name)] } }, `${a.name} /${a.p}`)); cur = a.net + a.size; } if (cur < base + 256) b.append(h('div', { style: { flex: String(base + 256 - cur), background: 'var(--surface-3)' } }, 'livre')); return b; };
  const n = naive();
  return h('div', { class: 'card tight stack' }, h('div', { class: 'small' }, 'Demandas em 192.168.1.0/24: P2P = 2 hosts (/30), X = 100 hosts (/25), Y = 60 hosts (/26). Total necessário: 4 + 128 + 64 = 196 de 256 — cabe.'),
    h('div', { class: 'small' }, h('strong', {}, 'Na ordem do enunciado (P2P primeiro):')), bar(n), h('div', { class: 'note bad small', style: { margin: 0 } }, n.some(x => x.fail) ? `${n.filter(x => x.fail).map(x => x.name).join(', ')} não coube: o /30 em .0 impediu o /25 de começar em .0; o /25 foi para .128 e não sobrou fronteira /26 livre depois dele (.4–.127 ficou fragmentado).` : 'Coube.'),
    h('div', { class: 'small' }, h('strong', {}, 'Maior → menor:')), bar(good), h('div', { class: 'note ok small', style: { margin: 0 } }, 'X em .0/25, Y em .128/26, P2P em .192/30 — tudo cabe e o espaço livre (.196–.255) fica contínuo para demandas futuras.'));
};

/* ---- Simulador de aprendizado MAC ---- */
Widgets.macSim = () => {
  const pcs = [{ id: 'A', mac: 'AA:AA:AA:00:00:01', port: 'Fa0/1', x: 90, y: 60 }, { id: 'B', mac: 'BB:BB:BB:00:00:02', port: 'Fa0/2', x: 90, y: 200 }, { id: 'C', mac: 'CC:CC:CC:00:00:03', port: 'Fa0/3', x: 510, y: 60 }, { id: 'D', mac: 'DD:DD:DD:00:00:04', port: 'Fa0/4', x: 510, y: 200 }];
  const SW = { x: 300, y: 130 };
  const script = [['A', 'B'], ['B', 'A'], ['C', '*'], ['A', 'B'], ['D', 'C'], ['C', 'D']];
  // pré-computa estados
  function simulate(seq) {
    const table = []; const frames = [];
    for (const [s, d] of seq) {
      const S = pcs.find(p => p.id === s);
      const learnedNew = !table.some(e => e.mac === S.mac);
      if (learnedNew) table.push({ mac: S.mac, port: S.port, pc: S.id });
      let action, outs;
      if (d === '*') { action = 'broadcast'; outs = pcs.filter(p => p.id !== s).map(p => p.id); }
      else { const e = table.find(x => x.pc === d); if (e) { action = 'forward'; outs = [d]; } else { action = 'flood'; outs = pcs.filter(p => p.id !== s).map(p => p.id); } }

  const dstSel = h('select', { class: 'input', 'aria-label': 'Destino' }, [...pcs.map(p => h('option', { value: p.id }, `Destino ${p.id}`)), h('option', { value: '*' }, 'Broadcast FF:FF…')]);
  const extra = h('div', { class: 'row' }, srcSel, dstSel, h('button', { class: 'btn sm primary', onclick: () => { if (srcSel.value === dstSel.value) { toast('Origem e destino iguais.'); return; } seq.push([srcSel.value, dstSel.value]); build(seq.length - 1); } }, 'Enviar quadro'), h('button', { class: 'btn sm ghost', onclick: () => { seq = [...script]; build(0); } }, 'Limpar tabela'));
  function build(start = 0) {
    const frames = simulate(seq);

    const p = Player({ steps, render: (i, s) => draw(s.f), extra });
    host.innerHTML = ''; host.append(p);
    if (start) { const b = $$('.sim-steps button', p)[start]; if (b) b.click(); }
  }
  function draw(f) {
    const links = pcs.map(p => { const active = p.id === f.s || f.outs.includes(p.id); return `<line x1="${p.x}" y1="${p.y}" x2="${SW.x}" y2="${SW.y}" class="link ${active ? 'active' : ''}"/>`; }).join('');
    const nodes = pcs.map(p => nodeBox(p.x, p.y, `PC ${p.id}`, p.port, 'pc', p.id === f.s ? 'src' : '')).join('');
    const arrows = f.outs.map(o => { const p = pcs.find(x => x.id === o); return `<circle cx="${(p.x + SW.x) / 2}" cy="${(p.y + SW.y) / 2}" r="7" fill="var(--primary)"/>`; }).join('');
    const S = pcs.find(p => p.id === f.s);

    const rows = f.table.map((e, k) => `<text x="610" y="${92 + k * 18}" class="lbl" font-family="var(--mono)">${e.mac.slice(0, 8)}… ${e.port}</text>`).join('');
    return svg(820, 260, `${links}${nodes}${nodeBox(SW.x, SW.y, 'Switch', '', 'sw')}${src}${arrows}<rect x="600" y="50" width="210" height="${Math.max(60, 40 + f.table.length * 18)}" rx="8" fill="var(--surface)" stroke="var(--border-strong)"/><text x="612" y="72" font-weight="700" font-size="13">Tabela MAC</text>${rows || '<text x="612" y="94" class="lbl-s">(vazia)</text>'}<text x="20" y="250" class="lbl-s">● âmbar = quadro entrando · ● terracota = saídas</text>`, `Switch com 4 PCs; quadro de ${f.s}`);

/** Link + rótulo para uma recomendação */
function recTarget(rec) {
  if (rec.kind === 'exam' || rec.type === 'exam') return { href: '#/simulado', label: 'Fazer o simulado' };
  if (rec.type === 'final') return { href: '#/fracos', label: 'Revisar pontos fracos' };
  const t = CONFIG.topics.find(x => x.id === rec.topicId);
  if (rec.type === 'learn') return { href: `#/aprender/${t.module}/${t.section}`, label: `Estudar: ${t.name}` };
  if (rec.type === 'review') return { href: `#/flashcards/${t.id}`, label: `Revisar flashcards: ${t.name}` };

function topicSigs(st, topic) { return new Set(st.history.filter(x => x.topic === topic && x.sig && x.context !== 'diagnostic').map(x => x.sig)); }

/** Escolhe a próxima questão do tópico evitando as já resolvidas. Retorna {q, note} */
function pickQuestion(topic, difficulty) {
  const st = App.st;
  const solved = new Set(Object.keys(st.solved));
  const gens = Gen.byTopic[topic] || [];
  const bank = Bank.exam.filter(q => q.topic === topic);
  const n = (PracticeMem.count[topic] = (PracticeMem.count[topic] || 0) + 1);
  const bankFresh = bank.filter(q => !solved.has(q.sig));
  const useBank = !gens.length || (bankFresh.length && n % 3 === 0);
  if (useBank) {
    const byPref = [...bank].sort((a, b) => {
      const ra = st.solved[a.sig], rb = st.solved[b.sig];
      const rank = r => !r ? 0 : r.result === 'incorrect' ? 1 : r.result === 'assisted' ? 2 : 3;
      return rank(ra) - rank(rb) || (a.difficulty === difficulty ? -1 : 0) - (b.difficulty === difficulty ? -1 : 0) || ((ra && ra.at) || 0) - ((rb && rb.at) || 0);
    });
    const q = byPref[0];
    if (q) {
      const allDone = bank.every(x => st.solved[x.sig] && st.solved[x.sig].result === 'independent');
      return { q, note: allDone ? `Você já resolveu sozinho todas as ${bank.length} questões fixas deste tópico; esta é a mais antiga. Use "Resetar resolvidas" para recomeçar.` : null };
    }
  }
  const idx = (PracticeMem.rr[topic] = ((PracticeMem.rr[topic] ?? -1) + 1) % gens.length);
  const q = Gen.make(gens[idx], difficulty, Date.now() ^ (n * 2654435761), solved);
  return { q, note: solved.has(q.sig) ? 'Não encontramos uma variação inédita desta vez; esta já apareceu antes.' : null };
}

function labLayout(lab, id) {
  const pos = {};
  const devs = Object.entries(lab.devices);
  if (id === 'stp') { Object.assign(pos, { S1: [170, 80], S2: [530, 80], S3: [350, 220] }); }

    const sws = devs.filter(([, d]) => d.type === 'switch').map(([k]) => k);
    const rts = devs.filter(([, d]) => d.type === 'router').map(([k]) => k);
    sws.forEach((s, i) => { pos[s] = [sws.length === 1 ? 300 : 170 + i * (360 / Math.max(1, sws.length - 1)), 140]; });
    rts.forEach((r, i) => { pos[r] = [580, 140 + i * 60]; });
  }
  const hostsBySw = {};
  for (const hst of Object.values(lab.hosts)) (hostsBySw[hst.sw] = hostsBySw[hst.sw] || []).push(hst);

}

function labTopology(S, id) {

    const swSide = A.type === 'switch' ? [l.a, l.pa] : [l.b, l.pb];
    const trunk = IOS.trunkUp(lab, swSide[0], swSide[1]);

  }

  const x0 = Math.min(...xs) - 100, y0 = Math.min(...ys) - 60, w = Math.max(...xs) - x0 + 100, hh = Math.max(...ys) - y0 + 50;

  return el;
}

        h('button', { class: 'btn sm ghost', onclick: () => { st.settings.weights = { ...CONFIG.defaults.weights }; st.settings.importance = {}; App.save(); render(); } }, 'Restaurar valores padrão')),
      h('section', { class: 'card stack', style: { marginTop: '16px' } }, h('h2', {}, 'Backup do progresso'),
        h('p', { class: 'small', style: { margin: 0 } }, `O progresso fica salvo apenas neste navegador${Store.isStorageOk() ? '' : ' — ATENÇÃO: o armazenamento local não está disponível agora; exporte para não perder dados'}. Ele não sincroniza sozinho entre dispositivos: para levar a outro aparelho, exporte aqui e importe lá.`),
        h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: exportFile }, icon('download'), 'Exportar progresso (.json)'), h('label', { class: 'btn', for: 'imp', tabindex: '0', onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } } }, icon('upload'), 'Importar progresso'), fileIn,
          Store.readBackup(App.storage) ? h('button', { class: 'btn ghost', onclick: restoreBackup }, 'Restaurar backup anterior à última importação') : null)),
      h('section', { class: 'card stack', style: { marginTop: '16px' } }, h('h2', {}, 'Resetar'),
        h('p', { class: 'small muted', style: { margin: 0 } }, 'Cada opção pede confirmação. Exporte antes se quiser guardar.'),
        h('div', { class: 'row' },
          resetBtn('Questões resolvidas (anti-repetição)', 'Todas as questões voltam a ser inéditas. Desempenho e domínio são mantidos.', () => { st.solved = {}; }),
          resetBtn('Flashcards', 'Todos os cartões voltam para "novos".', () => { st.flash = { cards: {}, lastId: null, filter: 'all' }; }),
          resetBtn('Simulados', 'Apaga o histórico de simulados (as respostas continuam no histórico geral).', () => { st.exams = []; st.examDraft = null; }),
          resetBtn('Laboratórios', 'Todos os cenários voltam ao estado inicial.', () => { st.lab = { scenario: 'lab346', states: {} }; }),
          resetBtn('TUDO (recomeçar do zero)', 'Apaga todo o progresso: histórico, domínio, cronograma, flashcards, simulados e laboratórios.', () => { App.st = Store.defaultState(); }, true))),
      h('section', { class: 'card stack', style: { marginTop: '16px' } }, h('h2', {}, 'Matriz de cobertura'), h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' }, h('thead', {}, h('tr', {}, h('th', {}, 'Conteúdo'), h('th', {}, 'Fonte'))), h('tbody', {}, Cards.coverage.map(([c, s]) => h('tr', {}, h('td', {}, c), h('td', { class: 'small' }, s))))))),
      h('section', { class: 'card stack', style: { marginTop: '16px' } }, h('h2', {}, 'Usar no celular (offline)'),
        h('ol', { class: 'small', style: { margin: 0 } }, h('li', {}, 'Copie o arquivo estudo_prova2.html para o celular (cabo USB, Bluetooth ou nuvem — o arquivo em si funciona sem internet).'), h('li', {}, 'Abra pelo gerenciador de arquivos com o navegador (Firefox para Android costuma abrir arquivos locais; alguns navegadores bloqueiam file://).'), h('li', {}, 'Se o navegador não salvar o progresso em arquivo local, use Exportar/Importar ao terminar cada sessão.'), h('li', {}, 'Alternativa sem internet: no notebook, rode um servidor local (ex.: "python3 -m http.server" na pasta) e acesse pelo Wi-Fi da mesma rede. Não testado neste ambiente.'))),
      h('p', { class: 'tiny muted', style: { marginTop: '16px' } }, `Versão ${CONFIG.appVersion} · estado v${CONFIG.stateVersion} · terminal IOS é um subconjunto educacional, não um emulador completo.`));
  }
  function resetBtn(label, body, fn, danger) {
    return h('button', { class: `btn sm ${danger ? 'danger' : ''}`, onclick: async () => { if (!await confirmDialog({ title: `Resetar: ${label}?`, body, ok: 'Resetar', danger: true })) return; fn(); App.save(true); App.applyTheme(); updateNavCounts(); toast('Feito.'); render(); } }, label);
  }
  function exportFile() {
    const blob = new Blob([JSON.stringify(App.st, null, 1)], { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `progresso-redes-prova2-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json` });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Arquivo de progresso gerado.');
  }
  function importFile(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { toast('Arquivo grande demais para ser um progresso desta plataforma.'); return; }
    const rd = new FileReader();
    rd.onload = async () => {
      let obj; try { obj = JSON.parse(rd.result); } catch (e) { toast('O arquivo não é um JSON válido.'); return; }
      const v = Store.validate(obj);
      if (!v.ok) { await confirmDialog({ title: 'Não foi possível importar', body: h('ul', {}, v.errors.map(x => h('li', {}, x))), ok: 'OK', cancel: 'Fechar' }); return; }
      const s = Store.summary(v.state), cur = Store.summary(App.st);
      const body = h('div', { class: 'small' }, h('p', {}, 'Isto vai SUBSTITUIR o progresso atual deste navegador. Um backup do atual será guardado e poderá ser restaurado.'),
        h('table', { class: 'tbl' }, h('thead', {}, h('tr', {}, h('th', {}, ''), h('th', {}, 'Atual'), h('th', {}, 'Arquivo'))), h('tbody', {}, [['Respostas', cur.attempts, s.attempts], ['Simulados', cur.exams, s.exams], ['Blocos concluídos', cur.blocksDone, s.blocksDone], ['Última atualização', new Date(cur.updatedAt).toLocaleString('pt-BR'), new Date(s.updatedAt).toLocaleString('pt-BR')]].map(r => h('tr', {}, r.map(c => h('td', {}, String(c))))))));
      if (!await confirmDialog({ title: 'Importar este progresso?', body, ok: 'Substituir pelo arquivo' })) return;
      Store.backup(App.storage, App.st); App.st = v.state; App.applyTheme(); App.save(true); updateNavCounts(); toast('Progresso importado.'); render();
    };
    rd.readAsText(file);
  }
  async function restoreBackup() {
    const b = Store.readBackup(App.storage); const v = b && Store.validate(b);
    if (!v || !v.ok) { toast('Backup indisponível ou inválido.'); return; }
    if (!await confirmDialog({ title: 'Restaurar o backup?', body: 'O progresso atual será trocado pelo que existia antes da última importação.', ok: 'Restaurar' })) return;
    App.st = v.state; App.applyTheme(); App.save(true); updateNavCounts(); render(); toast('Backup restaurado.');
  }
  render();
  return root;
};

Pages.notFound = () => h('div', { class: 'content narrow' }, pageHead('Página não encontrada', 'O endereço não corresponde a nenhuma seção.'), h('a', { class: 'btn primary', href: '#/inicio' }, 'Ir para o início'));

/* ===== 99-main.js ===== */
/* ==========================================================================
   Layout, navegação, roteador e inicialização
   ========================================================================== */
App.cleanup = [];
const NAV = [
  ['inicio', 'Início', 'home'], ['plano', 'Plano de estudo', 'plan'], ['aprender', 'Aprender', 'learn'], ['praticar', 'Praticar', 'practice'],
  ['laboratorio', 'Laboratório', 'lab'], ['simulado', 'Simulado', 'exam'], ['fracos', 'Meus pontos fracos', 'weak'], ['revisao', 'Revisão final', 'review'], ['config', 'Configurações', 'settings'],
];
function buildShell() {
  const nav = h('nav', { class: 'nav', 'aria-label': 'Principal' }, NAV.map(([id, label, ic]) => h('a', { href: `#/${id}`, 'data-nav': id }, icon(ic), h('span', {}, label), h('span', { class: 'count', 'data-count': id, hidden: true }))));
  const sidebar = h('aside', { class: 'sidebar', id: 'sidebar' },
    h('div', { class: 'brand' }, h('div', { class: 'brand-mark' }, icon('net')), h('div', {}, h('div', { class: 'brand-title' }, 'Redes · Prova 2'), h('div', { class: 'brand-sub' }, 'Plataforma de estudo offline'))),
    nav,
    h('div', { class: 'sidebar-foot' }, h('div', { id: 'exam-count' }), h('button', { class: 'btn ghost sm', style: { marginTop: '8px', paddingLeft: 0 }, onclick: () => { const t = App.st.settings.theme; const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); App.st.settings.theme = dark ? 'light' : 'dark'; App.applyTheme(); App.save(); } }, 'Alternar tema claro/escuro')));
  const topbar = h('header', { class: 'topbar' }, h('button', { class: 'btn ghost icon-btn', 'aria-label': 'Abrir menu', 'aria-controls': 'sidebar', 'aria-expanded': 'false', id: 'menu-btn', onclick: () => toggleMenu(true) }, icon('menu')), h('div', { class: 'title', id: 'top-title' }, 'Redes · Prova 2'));
  const main = h('main', { class: 'main', id: 'main', tabindex: '-1' }, topbar, h('div', { id: 'view' }));
  const app = h('div', { class: 'app' }, h('a', { href: '#main', class: 'sr-only', onfocus: e => e.target.classList.remove('sr-only'), onblur: e => e.target.classList.add('sr-only') }, 'Pular para o conteúdo'), sidebar, main);
  document.body.innerHTML = ''; document.body.append(app);
}
function toggleMenu(open) {
  const sb = $('#sidebar'); const btn = $('#menu-btn');
  sb.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open));
  const old = $('.scrim'); if (old) old.remove();
  if (open) { document.body.append(h('div', { class: 'scrim', onclick: () => toggleMenu(false) })); $('a', sb).focus(); }
}
function updateNavCounts() {
  const st = App.st; if (!st || !$('[data-count]')) return;
  const due = Object.values(Flash.dueByTopic(Cards.cards, st.flash.cards)).reduce((a, b) => a + b, 0);
  const weak = Weak.analyze(st.history, st.weak.marked).filter(w => w.status === 'ativo').length;
  const set = (id, n) => { const el = $(`[data-count="${id}"]`); if (!el) return; el.hidden = !n; el.textContent = String(n); el.setAttribute('aria-label', `${n} pendente(s)`); };
  set('praticar', due); set('fracos', weak);
  const d = daysToExam(); const ec = $('#exam-count'); if (ec) ec.textContent = d > 1 ? `Prova em ${d} dias` : d === 1 ? 'Prova amanhã' : d === 0 ? 'Prova hoje' : 'Prova realizada';
}

function route() {
  for (const fn of App.cleanup.splice(0)) { try { fn(); } catch (e) { /* ignora */ } }
  const hash = location.hash || '#/inicio';
  const parts = hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const [area = 'inicio', a1, a2, a3] = parts;
  App.routeArea = area; App.routeTopic = null;
  let view;
  try {
    if (!App.st.settings.mode && !['config', 'diagnostico'].includes(area)) view = Pages.welcome();
    else switch (area) {
      case 'inicio': view = Pages.inicio(); break;
      case 'plano': view = Pages.plano(); break;
      case 'diagnostico': view = Pages.diagnostico(); break;
      case 'aprender': view = a1 ? Pages.modulo(a1, a2) : Pages.aprender(); break;
      case 'praticar': view = a1 ? Pages.praticarTopico(a1, a2) : Pages.praticar(); break;
      case 'flashcards': App.routeArea = 'praticar'; view = Pages.flashcards(a1); break;
      case 'laboratorio': view = a1 ? Pages.labScenario(a1) : Pages.laboratorio(); break;
      case 'simulado': view = a1 === 'resultado' ? Pages.simuladoResultado(a2) : Pages.simulado(); break;
      case 'fracos': view = Pages.fracos(); break;
      case 'revisao': view = Pages.revisao(); break;
      case 'config': view = Pages.config(); break;
      default: view = Pages.notFound();
    }
  } catch (err) {
    console.error(err);
    view = h('div', { class: 'content narrow' }, pageHead('Algo deu errado nesta tela', 'O restante da plataforma continua funcionando. Seu progresso não foi apagado.'), h('pre', { class: 'cli' }, String(err && err.message || err)), h('a', { class: 'btn primary', href: '#/inicio' }, 'Voltar ao início'));
  }
  void a3;
  const v = $('#view'); v.innerHTML = ''; v.append(view);
  const navId = area === 'flashcards' ? 'praticar' : area === 'diagnostico' ? 'inicio' : area;
  $$('[data-nav]').forEach(a => a.toggleAttribute('aria-current', false));
  const cur = $(`[data-nav="${navId}"]`); if (cur) cur.setAttribute('aria-current', 'page');
  const label = (NAV.find(n => n[0] === navId) || [0, 'Redes · Prova 2'])[1];
  $('#top-title').textContent = label; document.title = `${label} · Redes Prova 2`;
  toggleMenu(false);
  if (!(area === 'aprender' && a2)) window.scrollTo(0, 0);
  App.st.lastRoute = hash; App.save();
  updateNavCounts();
}

function boot() {
  App.init();
  buildShell();
  window.addEventListener('hashchange', route);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sidebar.open')) toggleMenu(false); });
  window.addEventListener('beforeunload', () => App.save(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') App.save(true); });
  if (!location.hash && App.st.lastRoute && App.st.settings.mode) history.replaceState(null, '', App.st.lastRoute);
  route();
  startTimeTracking();
}
if (typeof document !== 'undefined') { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot(); }

</script>
